<style>
:root{
  --primary:#1b2a4a; --primary-light:#28406e; --accent:#2f80ed; --accent-2:#0f9d58;
  --bg:#f4f6fb; --card:#ffffff; --border:#e3e7f0; --text:#1e2433; --muted:#6b7280;
  --danger:#e0433a; --warn:#f2994a; --ok:#0f9d58; --info:#2f80ed;
  --radius:10px; --shadow:0 2px 10px rgba(20,30,60,0.06);
}
/* Dark mode overrides - toggled via [data-theme="dark"] on <html>. --accent
   and --primary are left alone here so a custom accent color picked by the
   user (stored separately) keeps working the same in both light and dark. */
html[data-theme="dark"]{
  --bg:#12151d; --card:#1c2130; --border:#2b3145; --text:#e7e9f0; --muted:#9aa2b8;
  --primary-light:#2a3a5c;
}
html[data-theme="dark"] body{ background:var(--bg); color:var(--text); }
html[data-theme="dark"] .login-box{ background:#1c2130; }
html[data-theme="dark"] .login-box h1{ color:var(--text); }
html[data-theme="dark"] ::-webkit-scrollbar-thumb{ background:#39415a; }
html[data-theme="dark"] .topbar{ background:var(--card); }
html[data-theme="dark"] .topbar .roleTag{ background:#2a3350; color:#cfe0ff; }
html[data-theme="dark"] .input{ background:var(--card); color:var(--text); }
html[data-theme="dark"] .tbl-wrap{ background:var(--card); }
html[data-theme="dark"] .modal{ background:var(--card); color:var(--text); }
html[data-theme="dark"] .att-grid td.att-name{ background:var(--card); }
html[data-theme="dark"] table.tbl th{ background:#232a3d; color:var(--text); }
html[data-theme="dark"] table.tbl td{ border-color:var(--border); }
html[data-theme="dark"] table.tbl tr:hover td{ background:#232a3d; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:'Segoe UI', Roboto, -apple-system, Arial, sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
}
a{color:var(--accent); text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#c7cede; border-radius:4px;}

/* ---------- LOGIN ---------- */
#loginScreen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#1b2a4a 0%,#2f80ed 100%); z-index:9999;
}
.login-box{
  background:#fff; width:360px; max-width:92vw; border-radius:16px; padding:36px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.login-box h1{font-size:19px; margin:0 0 4px; color:var(--primary);}
.login-box p.sub{margin:0 0 22px; color:var(--muted); font-size:13px;}
.login-box label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 6px;}
.login-box input{
  width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none;
}
.login-box input:focus{border-color:var(--accent);}
.login-box button{
  width:100%; margin-top:22px; padding:12px; background:var(--accent); color:#fff; border:none;
  border-radius:8px; font-weight:600; font-size:14px;
}
.login-box button:hover{background:#2668c9;}
.login-error{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}
.login-hint{margin-top:18px; font-size:11.5px; color:#9aa2b1; text-align:center;}

/* ---------- PWA SAFE AREA (iPhone notch / Home Indicator) ---------- */
/* Additive only - keeps every existing size/position, just adds inset padding
   so nothing sits under the notch or gets covered by the home indicator when
   running standalone (installed) on iOS. On browsers without notches these
   env() values resolve to 0px, so there is no visual change there. */
html, body{ height:100%; }
#loginScreen{
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.sidebar{ padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left); }
#pwaInstallBanner{
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  padding-left: calc(14px + env(safe-area-inset-left));
  padding-right: calc(14px + env(safe-area-inset-right));
}

/* ---------- APP SHELL ---------- */
#app{display:none; height:100vh; overflow:hidden;}
.shell{display:flex; height:100%;}
.sidebar{
  width:230px; background:var(--primary); color:#dfe6f5; flex-shrink:0; display:flex; flex-direction:column;
  transition:transform .2s ease; z-index:60;
}
.sidebar .brand{
  padding:20px 18px; font-weight:700; font-size:15px; color:#fff; border-bottom:1px solid rgba(255,255,255,0.08);
  line-height:1.3;
}
.sidebar .brand small{display:block; font-weight:400; font-size:11px; color:#9fb1d6; margin-top:3px;}
.nav{flex:1; overflow-y:auto; padding:10px 0;}
.nav .navitem{
  display:flex; align-items:center; gap:10px; padding:10px 18px; font-size:13.5px; color:#c7d1ea; cursor:pointer;
  border-left:3px solid transparent;
}
.nav .navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav .navitem.active{background:rgba(47,128,237,0.18); border-left-color:var(--accent); color:#fff; font-weight:600;}
.nav .navitem .ico{width:18px; text-align:center;}
.nav .navgroup{padding:14px 18px 4px; font-size:10.5px; letter-spacing:.06em; color:#7f8cad; text-transform:uppercase;}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  min-height:58px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center;
  padding:env(safe-area-inset-top) 20px 0; gap:14px; flex-shrink:0;
}
.topbar .menuBtn{display:none; background:none; border:none; font-size:20px; color:var(--primary);}
.topbar h2{font-size:16px; margin:0; color:var(--primary); flex:1;}
.topbar .userchip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text);}
.topbar .userchip .avatar{
  width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:13px;
}
.topbar .roleTag{font-size:10.5px; background:#eef2fb; color:var(--primary); padding:2px 8px; border-radius:20px; font-weight:600;}
.topbar .logoutBtn{background:none; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12.5px; color:var(--muted); flex-shrink:0; white-space:nowrap;}
.topbar .logoutBtn:hover{border-color:var(--danger); color:var(--danger);}
.topbar-more-actions{display:flex; align-items:center; flex-shrink:0;}
.topbar-more-wrap{position:relative; display:none; flex-shrink:0;}
.topbar-more-btn{font-size:22px; padding:4px 8px; line-height:1;}
.topbar-more-panel{
  display:none; position:absolute; top:38px; right:0; background:#fff; border:1px solid var(--border);
  border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.18); padding:8px; flex-direction:column; gap:6px;
  z-index:60; min-width:190px;
}
html[data-theme="dark"] .topbar-more-panel{background:var(--card);}
.topbar-more-panel.open{display:flex;}
.topbar-more-panel .btn{width:100%; text-align:left;}

.content{flex:1; overflow-y:auto; padding:20px;}
.section{display:none;}
.section.active{display:block;}

/* ---------- COMMON UI ---------- */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
.card h3{margin:0 0 12px; font-size:14.5px; color:var(--primary);}
.stat-card{padding:16px;}
.stat-card .label{font-size:12px; color:var(--muted); margin-bottom:6px;}
.stat-card .value{font-size:26px; font-weight:700; color:var(--primary);}
.stat-card .value.small{font-size:20px;}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.toolbar .spacer{flex:1;}
.input, select.input, textarea.input{
  padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; outline:none; background:#fff;
}
.input:focus{border-color:var(--accent);}
textarea.input{width:100%; min-height:70px; resize:vertical;}
.btn{
  padding:9px 16px; border-radius:8px; border:none; font-size:13px; font-weight:600; background:var(--accent); color:#fff;
}
.btn:hover{background:#2668c9;}
.btn.secondary{background:#eef2fb; color:var(--primary);}
.btn.secondary:hover{background:#e0e8fa;}
.btn.success{background:var(--ok);}
.btn.danger{background:var(--danger);}
.btn.warn{background:var(--warn);}
.btn.sm{padding:6px 10px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tbl th{
  text-align:left; padding:10px 12px; background:#f7f9fc; color:var(--muted); font-weight:600; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border);
}
table.tbl td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
table.tbl tr:hover td{background:#fafbff;}
.tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:#fff;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.badge.P, .badge.M, .badge.DONE, .badge.APPROVED, .badge.ACTIVE, .badge.COMPLETED, .badge.CLOSED{background:#e4f7ea; color:var(--ok);}
.badge.I, .badge.N, .badge.PENDING, .badge.NEW, .badge.OPEN{background:#fff4e5; color:var(--warn);}
.badge.A, .badge.O, .badge.PROBLEM, .badge.REJECTED, .badge.INACTIVE, .badge.LOCKED{background:#fde8e7; color:var(--danger);}
.badge.S, .badge.T, .badge.WAITING_APPROVAL, .badge.PROCESSING, .badge.POSTPONED{background:#eaf0fe; color:var(--accent);}
.badge.C, .badge.B, .badge.IN_PROGRESS, .badge.SKIPPED{background:#f1eefc; color:#7c5cd6;}
.badge.OK{background:#e4f7ea; color:var(--ok);}
.badge.MISSING, .badge.MISSING_COLUMNS{background:#fde8e7; color:var(--danger);}
.badge.UNASSIGNED, .badge.OVERDUE, .badge.CRITICAL, .badge.HIGH{background:#fde8e7; color:var(--danger);}
.badge.PRIMARY{background:#e4f7ea; color:var(--ok);}
.badge.BACKUP{background:#fff4e5; color:var(--warn);}

.progress{height:8px; border-radius:6px; background:#eef1f8; overflow:hidden;}
.progress > div{height:100%; background:var(--accent);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; flex-wrap:wrap;}
.tabs .tab{padding:9px 14px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;}
.tabs .tab.active{color:var(--accent); border-color:var(--accent); font-weight:600;}

.modal-overlay{position:fixed; inset:0; background:rgba(20,30,60,0.45); display:none; align-items:center; justify-content:center; z-index:500; padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff; border-radius:14px; width:520px; max-width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center;}
.modal-head h3{margin:0; font-size:15px; color:var(--primary); flex:1;}
.modal-head .close{background:none; border:none; font-size:20px; color:var(--muted);}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.formrow{margin-bottom:12px;}
.formrow label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px;}
.formrow .input{width:100%;}

.toast-container{position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px;}
.toast{
  padding:12px 16px; border-radius:8px; color:#fff; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  min-width:240px; animation:slideIn .2s ease;
}
.toast.SUCCESS{background:var(--ok);}
.toast.ERROR{background:var(--danger);}
.toast.WARNING{background:var(--warn);}
.toast.INFO{background:var(--accent);}
@keyframes slideIn{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

.loading-overlay{position:fixed; inset:0; background:rgba(255,255,255,0.6); display:none; align-items:center; justify-content:center; z-index:8000;}
.loading-overlay.active{display:flex;}
.spinner{width:38px; height:38px; border:4px solid #dfe6f7; border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-state{padding:40px 20px; text-align:center; color:var(--muted); font-size:13px;}
.muted{color:var(--muted);}
.pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.confirm-box p{font-size:13.5px; line-height:1.5;}
.dropzone{
  border:2px dashed var(--border); border-radius:10px; padding:26px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer;
}
.dropzone.drag{border-color:var(--accent); background:#f2f7ff;}
.kv{display:grid; grid-template-columns:140px 1fr; row-gap:8px; font-size:13px;}
.kv .k{color:var(--muted);}

@media(max-width:820px){
  .sidebar{position:fixed; top:0; bottom:0; left:0; transform:translateX(-100%); z-index:200;}
  .sidebar.open{transform:translateX(0);}
  .topbar .menuBtn{display:block;}
  .modal{width:94vw;}
}
/* Small phone screens: collapse the secondary action buttons (Sinkronkan /
   theme) behind a single overflow (⋮) menu so the user chip and Logout
   button always stay visible on-screen without horizontal scrolling. */
@media(max-width:600px){
  .topbar{padding:env(safe-area-inset-top) 10px 0; gap:8px;}
  .topbar h2{display:none;}
  .topbar-more-actions{display:none;}
  .topbar-more-wrap{display:block;}
  .topbar .userchip{gap:6px;}
  .topbar .userchip > div{max-width:86px; overflow:hidden;}
  .topbar .userchip #userName{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .logoutBtn{padding:6px 10px; font-size:12px;}
}

/* ---------- BOTTOM NAV (navigasi cepat, hanya tampil di HP/tablet kecil) ---------- */
.bottom-nav{display:none;}
@media(max-width:820px){
  .bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:150;
    background:var(--card); border-top:1px solid var(--border);
    box-shadow:0 -2px 10px rgba(20,30,60,0.08);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav .bn-item{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:7px 2px 6px; cursor:pointer; color:var(--muted);
    font-size:10.5px; font-weight:600; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .bottom-nav .bn-item .bn-ico{font-size:20px; line-height:1;}
  .bottom-nav .bn-item .bn-lbl{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bottom-nav .bn-item.active{color:var(--accent);}
  .bottom-nav .bn-item.active .bn-ico{transform:translateY(-1px);}
  body.has-bottom-nav .content{padding-bottom:calc(78px + env(safe-area-inset-bottom));}
  body.has-bottom-nav .toast-container{top:auto; bottom:calc(76px + env(safe-area-inset-bottom));}
  body.has-bottom-nav #pwaInstallBanner{bottom:calc(64px + env(safe-area-inset-bottom));}
}

/* ---------- DATAGRID (form input berbentuk tabel) ---------- */
.modal.wide{width:min(1280px,98vw);}
.dg-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.dg-sub{flex:1; min-width:220px; font-size:13px; color:var(--muted);}
.dg-wrap{overflow:auto; max-height:calc(88vh - 210px); border:1px solid var(--border); border-radius:var(--radius); background:var(--card); -webkit-overflow-scrolling:touch;}
table.dg{--dg-head:#f7f9fc; border-collapse:separate; border-spacing:0; font-size:13px; min-width:100%;}
html[data-theme="dark"] table.dg{--dg-head:#232a3d;}
.dg th{position:sticky; top:0; z-index:3; background:var(--dg-head); color:var(--muted); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; text-align:left; padding:11px 10px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); white-space:nowrap;}
.dg.has-groups th.dg-colh{top:30px;}
.dg th.dg-gh{height:30px; padding:6px 10px; font-size:10.5px; color:var(--accent); background:var(--dg-head); border-bottom:1px solid var(--border);}
.dg td{padding:6px 5px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); vertical-align:top; background:var(--card);}
.dg th.dg-no, .dg td.dg-no{position:sticky; left:0; z-index:2; width:44px; min-width:44px; text-align:center; color:var(--muted); font-weight:700; background:var(--dg-head); padding-top:15px;}
.dg th.dg-no{z-index:4; padding-top:11px;}
.dg .input{width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; min-height:38px; font-family:inherit;}
.dg select.input{padding-right:4px;}
.dg textarea.dg-ta{min-height:38px; height:38px; resize:vertical; line-height:1.3;}
.dg .dg-ro{background:var(--dg-head); color:var(--muted); cursor:default;}
.dg .dg-none{padding:10px; color:var(--muted); text-align:center;}
.dg td.dg-tdc{text-align:center;}
.dg .dg-chk{display:flex; align-items:center; justify-content:center; height:38px; margin:0;}
.dg .dg-chk input{width:18px; height:18px;}
.dg .dg-multi{text-align:left; cursor:pointer; color:var(--text); background:var(--card); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dg .dg-del{width:40px; text-align:center;}
.dg .dg-x{border:none; background:none; color:var(--muted); font-size:20px; line-height:1; padding:7px 8px; border-radius:6px; cursor:pointer;}
.dg .dg-x:hover{background:#fde8e7; color:var(--danger);}
.dg-req{color:var(--danger);}
.dg-info{color:var(--muted); cursor:help; font-size:12px; text-transform:none;}
.dg .dg-bad{border-color:var(--danger) !important; box-shadow:0 0 0 2px rgba(224,67,58,.18);}
.dg tr.dg-saved td{background:rgba(15,157,88,.07);}
.dg tr.dg-saved .input{opacity:.7;}
.dg tr.dg-error td.dg-no, .dg .dg-err{color:var(--danger);}
.dg .dg-ok{color:var(--ok); font-size:16px;}
.dg tr.dg-saving td{opacity:.65;}
.dg-pop{position:fixed; z-index:700; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.22); overflow:auto; padding:4px;}
.dg-pop label{display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; cursor:pointer; border-radius:6px; margin:0;}
.dg-pop label:hover{background:rgba(47,128,237,.08);}
@media(max-width:600px){ .dg-wrap{max-height:calc(100vh - 230px);} .dg-top .btn{flex:1;} }
.att-grid-wrap{overflow:auto; max-height:70vh; border:1px solid #e5e7ef; border-radius:10px;}
.att-grid{border-collapse:collapse; font-size:12px; width:100%;}
.att-grid th, .att-grid td{border:1px solid #e5e7ef; padding:0; text-align:center;}
.att-grid thead th{background:var(--primary); color:#fff; padding:8px 4px; position:sticky; top:0; z-index:3; min-width:34px;}
.att-grid thead th.att-name-h{position:sticky; left:0; top:0; z-index:4; text-align:left; padding-left:12px; min-width:180px;}
.att-grid td.att-name{ text-align:left; padding:8px 12px; white-space:nowrap; position:sticky; left:0; background:#fff; z-index:1;}
.att-grid td.att-name .nm{font-weight:700; color:var(--primary);}
.att-grid td.att-name .pos{font-weight:400; color:#888; font-size:11px; display:block;}
.att-code{width:38px; height:30px; border:none; background:#f4f5f8; color:#bbb; text-align:center; font-weight:700; font-size:11px; cursor:pointer; border-radius:4px; margin:2px;}
.att-code:hover{filter:brightness(0.95);}
.st-P{background:#e4f7ea; color:#0f9d58;}
.st-O{background:#fde8e7; color:#e0433a;}
.st-I{background:#fff4e5; color:#f2994a;}
.st-S{background:#eaf0fe; color:#2f80ed;}
.st-A{background:#fde8e7; color:#c0392b;}
.st-C{background:#f1eefc; color:#7c5cd6;}
.st-T{background:#eaf0fe; color:#2f6fed;}
.st-N{background:#fdf6d8; color:#b7950b;}
.st-B{background:#e9e9ec; color:#666;}
.att-cell.dirty{box-shadow:inset 0 0 0 2px var(--accent);}
.att-readonly{display:inline-block; width:30px; height:22px; line-height:22px; border-radius:5px; font-weight:700; font-size:11px;}
.att-legend .att-code{width:22px; height:20px; line-height:20px; padding:0; font-size:10px; display:inline-block;}
.shift-grid thead th.shift-dow-h{min-width:34px; font-size:10px;}
.shift-grid thead th.shift-dow-h .dow{font-weight:400; opacity:.85;}
.shift-grid thead th.shift-dow-h.weekend{background:#a8460f;}
.shift-grid thead th.shift-dow-h.holiday{background:#7a1f1f;}
.shift-grid td.shift-col-flag{background:#fff7ed;}
html[data-theme="dark"] .shift-grid td.shift-col-flag{background:rgba(255,140,0,0.08);}
.att-code.shift-flagged{box-shadow:inset 0 0 0 2px #e0433a;}
.shift-legend-dot{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle;}
.shift-legend-dot.weekend{background:#a8460f;}
.shift-legend-dot.holiday{background:#7a1f1f;}
.input.sm{padding:4px 6px; font-size:12px; height:auto;}
.shift-row-dirty{background:rgba(255,193,7,0.12);}
html[data-theme="dark"] .shift-row-dirty{background:rgba(255,193,7,0.08);}
.brand-logo-img{max-height:34px; max-width:100%; display:block; margin-bottom:2px;}
.menu-icon-row td{vertical-align:middle;}
.menu-icon-input{width:70px; text-align:center;}
.access-checklist{display:flex; flex-direction:column; gap:2px; max-height:360px; overflow:auto; border:1px solid #e5e7ef; border-radius:8px; padding:10px 14px;}
.access-checklist .navgroup-label{font-weight:700; font-size:11px; text-transform:uppercase; color:var(--primary); margin:10px 0 4px;}
.access-checklist label{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; cursor:pointer;}

<body>

<!-- ===== PWA: install banner (additive, hidden by default, only shown by JS when relevant) ===== -->
<div id="pwaInstallBanner" style="display:none; position:fixed; left:0; right:0; bottom:0; z-index:10000; background:#1b2a4a; color:#fff; padding:10px 14px; font-size:13px; align-items:center; gap:10px; box-shadow:0 -4px 18px rgba(0,0,0,0.2);">
  <span id="pwaInstallText" style="flex:1;">Install Wonderland Management di HP Anda untuk akses lebih cepat.</span>
  <button id="pwaInstallBtn" onclick="pwaTriggerInstall()" style="display:none; background:#2f80ed; color:#fff; border:none; border-radius:6px; padding:8px 14px; font-weight:600; font-size:13px; white-space:nowrap;">Install</button>
  <button onclick="pwaDismissBanner()" style="background:none; border:none; color:#c7d1ea; font-size:18px; padding:2px 6px;">&times;</button>
</div>

<script>
/*************************************************************************************************
 * GLOBAL STATE
 *************************************************************************************************/
var STATE = { token: null, role: null, username: null, name: null, employeeId: null, currentSection: 'dashboard' };
var SESSION_STORAGE_KEY = 'wlp_oms_session_token';
var CACHE = { employees: [], assets: [], taskMaster: [] };
// Owner-configurable app branding + sidebar customization (name/logo/icons/
// employee menu access), loaded via getAppMeta() before login so the login
// screen reflects it too, and refreshed after login / after Settings saves.
var APP_META = { appName: 'Wonderland Operation Management System', companyName: 'Wonderland Samarinda', logoUrl: '', menuIcons: {}, employeeMenuAccess: null };

/*************************************************************************************************
 * THEME (dark/light mode + custom accent color)
 * Preferences are stored in the browser's localStorage of the deployed web
 * app (NOT Google Drive/Sheets) so each user/device keeps their own choice.
 * Applied immediately on script load (before the DOM finishes) to avoid a
 * flash of the wrong theme.
 *************************************************************************************************/
var THEME_STORAGE_KEY = 'wonderland_oms_theme';
var THEME_ACCENT_KEY = 'wonderland_oms_accent';
var THEME_PRESETS = ['#2f80ed','#0f9d58','#e0433a','#7c5cd6','#f2994a','#0d9488','#c2185b'];
function getSavedTheme(){
  try { return localStorage.getItem(THEME_STORAGE_KEY) || 'light'; } catch(e){ return 'light'; }
}
function getSavedAccent(){
  try { return localStorage.getItem(THEME_ACCENT_KEY) || ''; } catch(e){ return ''; }
}
function applyTheme(mode, accent){
  document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
  if(accent){
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--info', accent);
  }
  var btn = document.getElementById('themeToggleBtn');
  if(btn) btn.innerHTML = mode === 'dark' ? '&#9728;' : '&#127769;';
}
function toggleThemeMode(){
  var current = getSavedTheme();
  var next = current === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch(e){}
  applyTheme(next, getSavedAccent());
}
function openThemeColorPicker(){
  var current = getSavedAccent() || '#2f80ed';
  var swatches = THEME_PRESETS.map(function(c){
    return '<button type="button" onclick="document.getElementById(\'themeColorInput\').value=\''+c+'\'" ' +
      'style="width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:'+c+';cursor:pointer;margin:2px;"></button>';
  }).join('');
  var body = '<div class="formrow"><label>Warna Tema (Accent Color)</label>' +
    '<input type="color" class="input" id="themeColorInput" value="'+current+'" style="height:44px;padding:4px;"></div>' +
    '<div class="formrow"><label>Pilihan Cepat</label><div>'+swatches+'</div></div>' +
    '<div class="muted" style="font-size:12px;">Warna ini akan dipakai untuk tombol, tab aktif, dan aksen lain di seluruh aplikasi - tersimpan di browser Anda masing-masing.</div>';
  openModal('Atur Warna Tema', body,
    '<button class="btn secondary" onclick="resetThemeColor()">Reset Default</button>' +
    '<button class="btn secondary" onclick="closeModal()">Batal</button>' +
    '<button class="btn" onclick="applyThemeColorFromPicker()">Terapkan</button>');
}
function applyThemeColorFromPicker(){
  var color = document.getElementById('themeColorInput').value;
  try { localStorage.setItem(THEME_ACCENT_KEY, color); } catch(e){}
  applyTheme(getSavedTheme(), color);
  closeModal();
  toast('SUCCESS','Warna tema diterapkan.');

/*************************************************************************************************
 * CORE HELPERS: loading, toast, api call wrapper, modal
 *************************************************************************************************/
function showLoading(){ document.getElementById('loadingOverlay').classList.add('active'); }
function hideLoading(){ document.getElementById('loadingOverlay').classList.remove('active'); }

function toast(type, message){
  var container = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}

function call(fnName){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    showLoading();
    GAS_API.invoke(fnName, args).then(function(res){
      hideLoading();
      if(!res){
        var e = new Error('Server tidak mengembalikan respons untuk ' + fnName + '. Periksa koneksi internet & URL Web App di config.js (dan pastikan Apps Script sudah di-deploy versi terbaru).');
        toast('ERROR', e.message);
        reject(e);
        return;
      }
      if(res.success === false){
        toast('ERROR', res.message || 'Terjadi kesalahan.');
        reject(res);
        return;
      }
      resolve(res.data);
    }, function(err){
      hideLoading();
      var msg = (err && err.message) ? err.message : String(err);
      toast('ERROR', msg);
      reject(err);
    });
  });
}

function openModal(title, bodyHtml, footHtml){
  document.getElementById('modalTitle').textContent = title;

var ID_DAY_NAMES = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'];
var ID_MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
/** "2026-08-26" + "08:00:00" -> "Rabu, 26 Agustus 2026, Pkl 08:00:00 WITA" */
function formatIndoDateTime(dateStr, timeStr){
  if(!timeStr) return '-';
  if(!dateStr) return 'Pkl '+timeStr+' WITA';
  var d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return 'Pkl '+timeStr+' WITA';
  return ID_DAY_NAMES[d.getDay()]+', '+d.getDate()+' '+ID_MONTH_NAMES[d.getMonth()]+' '+d.getFullYear()+', Pkl '+timeStr+' WITA';
}

function esc(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function doLogin(){
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  if(!username || !password){ document.getElementById('loginError').textContent = 'Username dan password wajib diisi.'; return; }
  showLoading();
  GAS_API.invoke('login', [username, password]).then(function(res){
    hideLoading();
    if(!res || !res.success){ document.getElementById('loginError').textContent = (res && res.message) || 'Login gagal.'; return; }
    STATE.token = res.data.token; STATE.role = res.data.role; STATE.username = res.data.username;
    STATE.name = res.data.name; STATE.employeeId = res.data.employeeId;
    persistSessionToken_(STATE.token);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAppMeta().then(function(){
      buildSidebar();
      buildBottomNav();
      buildTopbarUser();
      navigate('dashboard');
      if(res.data.mustChangePassword){ showChangePasswordModal(true); }
    });
  }, function(err){
    hideLoading();
    document.getElementById('loginError').textContent = (err && err.message) ? err.message : String(err);
  });
}

function doLogout(){
  confirmAction('Anda yakin ingin logout?', function(){
    call('logout', STATE.token).then(function(){
      STATE = { token:null, role:null, username:null, name:null, employeeId:null, currentSection:'dashboard' };
      persistSessionToken_(null);
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
    });
  });
}

/** Saves/clears the session token in localStorage so a page refresh (or reopening the tab) can resume the session instead of forcing a fresh login. Session-window preferences (theme) already use the same storage, see THEME_STORAGE_KEY above. */
function persistSessionToken_(token){
  try{
    if(token) localStorage.setItem(SESSION_STORAGE_KEY, token);
    else localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch(e){ /* localStorage unavailable (e.g. private mode) - session just won't survive refresh */ }
}

/**
 * On page load, tries to resume a previously saved session (from
 * localStorage) instead of always showing the login screen - this is what
 * stops a simple browser refresh from logging the user out. Validates the
 * saved token against the server (getCurrentSession) since Apps Script
 * sessions expire after a few hours; if it's no longer valid, silently falls
 * back to the login screen without bothering the user with an error toast.
 */
function attemptResumeSession_(){
  var saved = null;
  try{ saved = localStorage.getItem(SESSION_STORAGE_KEY); } catch(e){}
  if(!saved){ return; }
  document.getElementById('loginScreen').style.display = 'none';
  showLoading();
  GAS_API.invoke('getCurrentSession', [saved]).then(function(res){
    hideLoading();
    if(!res || !res.success || !res.data){
      persistSessionToken_(null);
      document.getElementById('loginScreen').style.display = 'flex';
      return;
    }
    STATE.token = saved; STATE.role = res.data.role; STATE.username = res.data.username;
    STATE.name = res.data.name; STATE.employeeId = res.data.employeeId;
    document.getElementById('app').style.display = 'block';
    loadAppMeta().then(function(){
      buildSidebar();
      buildBottomNav();
      buildTopbarUser();
      navigate('dashboard');
    });
  }, function(){
    hideLoading();
    persistSessionToken_(null);
    document.getElementById('loginScreen').style.display = 'flex';
  });
}

/*************************************************************************************************
 * SIDEBAR / NAVIGATION
 *************************************************************************************************/
/**
 * Returns the menu list for the current role, with two Owner-configurable
 * layers applied:
 *  - Icon overrides (APP_META.menuIcons: menu ID -> emoji/char), any role.
 *  - Menu access restriction (APP_META.employeeMenuAccess), EMPLOYEE role
 *    only, so Owner can hide specific menus from karyawan directly from
 *    Settings. Dashboard and Profile Saya are always kept so the sidebar can
 *    never be configured down to completely empty/unusable. Empty groups
 *    (all their items hidden) are dropped too.
 */
function getEffectiveMenu_(role){
  var menu = (MENU[role] || MENU.EMPLOYEE).slice();
  if(role === 'EMPLOYEE' && APP_META.employeeMenuAccess){
    var allowed = APP_META.employeeMenuAccess;
    var always = ['dashboard','profile'];
    menu = menu.filter(function(item){
      if(item.group) return true;
      return always.indexOf(item.id) !== -1 || allowed.indexOf(item.id) !== -1;
    });
    // Drop group headers that ended up with no items under them.
    var cleaned = [];
    for(var i=0;i<menu.length;i++){
      if(menu[i].group){
        var hasNext = menu[i+1] && !menu[i+1].group;
        if(!hasNext) continue;
      }
      cleaned.push(menu[i]);
    }
    menu = cleaned;
  }
  return menu;
}
function buildSidebar(){
  var menu = getEffectiveMenu_(STATE.role);
  var html = '';
  menu.forEach(function(item){
    if(item.group){ html += '<div class="navgroup">'+esc(item.group)+'</div>'; return; }
    var ico = (APP_META.menuIcons && APP_META.menuIcons[item.id]) || item.ico;
    html += '<div class="navitem" data-id="'+item.id+'" onclick="navigate(\''+item.id+'\')"><span class="ico">'+ico+'</span><span>'+esc(item.label)+'</span></div>';
  });
  document.getElementById('navContainer').innerHTML = html;
}


/**
 * Bottom navigation (navigasi cepat) untuk tampilan HP. Hanya menampilkan menu yang
 * memang tersedia untuk role yang sedang login (mengikuti getEffectiveMenu_), sehingga
 * pembatasan menu Karyawan dari Settings tetap berlaku. Ikon ikut pengaturan Ikon Menu.
 */
var BOTTOM_NAV_IDS = [
  { id: 'attendance', label: 'Attendance' },
  { id: 'dailytask', label: 'Daily Task' },
  { id: 'discipline', label: 'Disiplin' },
  { id: 'leaderboard', label: 'Leaderboard' },
  { id: 'report', label: 'Report' }
];
function buildBottomNav(){
  var nav = document.getElementById('bottomNav');
  if(!nav) return;
  var available = {};
  getEffectiveMenu_(STATE.role).forEach(function(item){ if(!item.group) available[item.id] = item; });
  var html = '';
  BOTTOM_NAV_IDS.forEach(function(b){
    var item = available[b.id];
    if(!item) return;
    var ico = (APP_META.menuIcons && APP_META.menuIcons[b.id]) || item.ico;
    html += '<div class="bn-item" data-id="'+b.id+'" onclick="navigate(\''+b.id+'\')"><span class="bn-ico">'+ico+'</span><span class="bn-lbl">'+esc(b.label)+'</span></div>';
  });
  nav.innerHTML = html;
  nav.style.display = html ? '' : 'none';
  document.body.classList.toggle('has-bottom-nav', !!html);
  highlightBottomNav_(STATE.currentSection);
}
function highlightBottomNav_(sectionId){
  document.querySelectorAll('#bottomNav .bn-item').forEach(function(n){
    n.classList.toggle('active', n.getAttribute('data-id') === sectionId);
  });
}

/** Applies APP_META (name/logo) to every visible branding spot: browser tab title, login screen, and sidebar brand block. */

/** Loads Owner-configured branding/menu settings; safe to call before login (public endpoint, no token needed). */
function loadAppMeta(){

  }).catch(function(){ /* fall back to defaults silently - branding is cosmetic */ });

var RENDERERS = {}; // filled per module below

function navigate(sectionId){
  // Frontend-side enforcement of the Owner-configured menu access for
  // EMPLOYEE role, mirroring what's already hidden from the sidebar - so a
  // restricted section can't be reached even by other means (e.g. a stale
  // link) while still logged in as EMPLOYEE.
  if(STATE.role === 'EMPLOYEE'){
    var effective = getEffectiveMenu_(STATE.role).filter(function(i){ return !i.group; }).map(function(i){ return i.id; });
    if(effective.indexOf(sectionId) === -1){
      toast('WARNING','Menu ini tidak tersedia untuk akun Anda.');
      sectionId = 'dashboard';
    }
  }
  STATE.currentSection = sectionId;
  document.querySelectorAll('.navitem').forEach(function(n){ n.classList.toggle('active', n.getAttribute('data-id') === sectionId); });
  highlightBottomNav_(sectionId);
  document.getElementById('topbarTitle').textContent = SECTION_TITLE[sectionId] || sectionId;
  document.getElementById('sidebar').classList.remove('open');
  var content = document.getElementById('content');
  content.innerHTML = '<div class="empty-state">Memuat...</div>';
  try {
    if(RENDERERS[sectionId]){
      RENDERERS[sectionId]();
    } else {
      content.innerHTML = '<div class="empty-state">Halaman tidak ditemukan.</div>';
    }
  } catch(err){
    content.innerHTML = '<div class="card"><h3 style="color:#e0433a;">Gagal memuat halaman</h3>' +

/**
 * "Sinkronkan" topbar button: re-fetches fresh data from the spreadsheet for
 * whatever section the user is currently viewing, without a full page/URL
 * reload. Every module already re-calls its API on navigate(), so this just
 * clears the shared local caches (employees/assets/taskMaster) and re-runs
 * the current renderer.
 */
/**
 * Turns a base64 payload from the server into a real download on the user's
 * own device (browser Downloads folder) - never touches Google Drive. Used
 * by report exports and payslip generation.
 */
function downloadBase64File(base64, filename, mimeType){
  var byteChars = atob(base64);
  var byteNumbers = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  var byteArray = new Uint8Array(byteNumbers);
  var blob = new Blob([byteArray], { type: mimeType || 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function syncNow(){
  var btn = document.getElementById('syncBtn');
  if(btn){ btn.disabled = true; btn.textContent = '\u23F3 Menyinkronkan...'; }
  CACHE.employees = []; CACHE.assets = []; CACHE.taskMaster = [];
  try {
    navigate(STATE.currentSection || 'dashboard');
    toast('SUCCESS', 'Data disinkronkan dengan spreadsheet.');
  } catch(e){
    toast('ERROR', 'Gagal sinkronisasi: ' + ((e && e.message) || e));
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '&#128260; Sinkronkan'; }
  }
}
// Global safety net: if any page-level promise chain rejects without its own

var DASH_FILTER = { mode:'DATE', date: null, month: null, year: null };
/**
 * Builds a yyyy-MM-dd string from the BROWSER'S LOCAL date/time (not UTC).
 * Date.toISOString() always returns the UTC date, which is wrong for
 * Asia/Makassar (UTC+8): any time between 00:00-07:59 local, toISOString()
 * still shows the PREVIOUS day. That mismatched the server's todayStr()
 * (which uses the script's Asia/Makassar timezone), so the Dashboard's
 * "Harian" (DATE mode) view was silently asking the server for yesterday's
 * attendance while today's records already existed - the exact reason
 * today's attendance showed up fine in "Bulanan"/"Tahunan" (which only
 * filter by month/year, not the exact day) but not in "Harian".
 */
function localDateStr(d){
  d = d || new Date();
  var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), day = ('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+day;
}

/**
 * Simple dependency-free SVG bar chart for the attendance summary card.
 * Built inline (no external chart library) so it works the same whether the
 * web app is opened online or the HTML is cached offline.
 */
function attendanceChartHtml(summary, mode){
  var codes = ['P','O','I','S','A','C','T','N','B'];
  var colors = { P:'#0f9d58', O:'#e0433a', I:'#f2994a', S:'#2f80ed', A:'#c0392b', C:'#7c5cd6', T:'#2f6fed', N:'#b7950b', B:'#888' };
  var max = Math.max.apply(null, codes.map(function(c){ return summary[c]||0; }).concat([1]));
  var barW = 42, gap = 14, chartH = 140, leftPad = 8;
  var bars = '', labels = '';
  codes.forEach(function(c, i){
    var val = summary[c] || 0;
    var h = Math.round((val / max) * (chartH - 24));
    var x = leftPad + i * (barW + gap);
    var y = chartH - h;
    bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+(h||1)+'" rx="4" fill="'+colors[c]+'"></rect>' +
      '<text x="'+(x+barW/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+val+'</text>';
    labels += '<text x="'+(x+barW/2)+'" y="'+(chartH+18)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+c+'</text>';
  });
  var width = leftPad*2 + codes.length*(barW+gap) - gap;
  return '<h3 style="margin-top:0;">Grafik Attendance ('+(mode==='DATE'?'Hari Ini':(mode==='MONTH'?'Bulan Ini':'Tahun Ini'))+')</h3>' +
    '<svg viewBox="0 0 '+width+' '+(chartH+30)+'" style="width:100%;max-width:560px;height:auto;display:block;">' + bars + labels + '</svg>' +
    '<div class="muted" style="font-size:12px;margin-top:6px;">P Hadir &middot; O Libur/Off &middot; I Izin &middot; S Sakit &middot; A Alpha &middot; C Cuti &middot; T Telat &middot; N 1/2 Hari &middot; B Belum Bekerja</div>';
}

var ATT_STATUS_CYCLE = ['', 'P', 'O', 'I', 'S', 'A', 'C', 'T', 'N', 'B'];
var ATT_STATUS_LABEL = { P:'P', O:'O', I:'I', S:'S', A:'A', C:'C', T:'T', N:'N', B:'B', '':'' };
var ATT_STATUS_NAME = { P:'Hadir', O:'Libur / Off', I:'Izin', S:'Sakit', A:'Alpha / Mangkir', C:'Cuti', T:'Telat', N:'1/2 Hari', B:'Belum Bekerja', '':'Belum Diisi' };
function loadAttendanceGrid(){
  ATT_GRID.pending = {};
  document.getElementById('attTableWrap').innerHTML = '<div class="empty-state">Memuat data absensi...</div>';
  call('getAttendanceMatrix', STATE.token, ATT_GRID.periodStart, ATT_GRID.periodEnd).then(function(res){
    ATT_GRID.data = res;
    renderAttendanceGrid();
  }).catch(function(err){
    document.getElementById('attTableWrap').innerHTML = '<div class="card"><p class="muted">Gagal memuat data: '+esc((err&&err.message)||'')+'</p></div>';
  });
}
function renderAttendanceGrid(){
  var isMgmt = ['OWNER','MANAGER','SUPERVISOR','ADMIN'].indexOf(STATE.role) !== -1;
  var res = ATT_GRID.data;
  if(!res){ return; }
  var html = '<div class="att-grid-wrap"><table class="att-grid shift-grid"><thead><tr><th class="att-name-h">Nama</th>' +
    res.dayMeta.map(function(dm){
      var cls = dm.isHoliday ? 'shift-dow-h holiday' : (dm.isWeekend ? 'shift-dow-h weekend' : 'shift-dow-h');
      var title = dm.isHoliday ? esc(dm.holidayNames.join(', ')) : (dm.isWeekend ? 'Akhir pekan' : '');
      return '<th class="'+cls+'" title="'+title+'">'+dm.day+'<br><span class="dow">'+dm.dowLabel+'</span></th>';
    }).join('') + '</tr></thead><tbody>';
  if(!res.rows.length){
    html += '<tr><td colspan="'+(res.dayMeta.length+1)+'" class="empty-state">Tidak ada karyawan aktif.</td></tr>';
  }
  res.rows.forEach(function(row){
    html += '<tr><td class="att-name"><span class="nm">'+esc(row.Name)+'</span><span class="pos">'+esc(row.Position||'')+'</span></td>';
    row.statuses.forEach(function(status, idx){
      var dm = res.dayMeta[idx];
      var extraCls = (dm.isHoliday||dm.isWeekend) ? ' shift-col-flag' : '';
      var title = ATT_STATUS_NAME[status] || '';
      if(isMgmt){
        var cellId = 'attcell_'+row.Employee_ID+'_'+idx;
        html += '<td class="att-cell'+extraCls+'" id="'+cellId+'">' +
          '<button type="button" class="att-code st-'+status+'" title="'+esc(title)+' (klik untuk ganti)" ' +
          'onclick="onAttCellClick(\''+row.Employee_ID+'\','+idx+',this)">'+(ATT_STATUS_LABEL[status]||'')+'</button></td>';
      } else {
        html += '<td class="'+extraCls.trim()+'"><span class="att-readonly st-'+status+'" title="'+esc(title)+'">'+(ATT_STATUS_LABEL[status]||'-')+'</span></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="muted att-legend" style="margin-top:10px;font-size:12px;">' +
    '<span class="att-code st-P" style="cursor:default;">P</span> Hadir &nbsp; ' +
    '<span class="att-code st-O" style="cursor:default;">O</span> Libur/Off &nbsp; ' +
    '<span class="att-code st-I" style="cursor:default;">I</span> Izin &nbsp; ' +
    '<span class="att-code st-S" style="cursor:default;">S</span> Sakit &nbsp; ' +
    '<span class="att-code st-A" style="cursor:default;">A</span> Alpha/Mangkir &nbsp; ' +
    '<span class="att-code st-C" style="cursor:default;">C</span> Cuti &nbsp; ' +
    '<span class="att-code st-T" style="cursor:default;">T</span> Telat &nbsp; ' +
    '<span class="att-code st-N" style="cursor:default;">N</span> 1/2 Hari &nbsp; ' +
    '<span class="att-code st-B" style="cursor:default;">B</span> Belum Bekerja &nbsp; ' +
    '<span class="shift-legend-dot weekend"></span> Sabtu/Minggu &nbsp; ' +
    '<span class="shift-legend-dot holiday"></span> Hari Libur Nasional / Cuti Bersama' +
    (isMgmt ? '<br>Klik sel untuk mengganti kode absensi secara otomatis (berurutan), lalu klik Simpan.' : '') + '</div>';
  document.getElementById('attTableWrap').innerHTML = html;
  if(isMgmt){ var btn = document.getElementById('attSaveBtn'); if(btn) btn.style.display = 'none'; }
}
function onAttCellClick(employeeId, idx, btnEl){
  var current = ATT_GRID.pending[employeeId+'|'+idx] ? ATT_GRID.pending[employeeId+'|'+idx].Status : (btnEl.textContent || '');
  var cIdx = ATT_STATUS_CYCLE.indexOf(current);
  var next = ATT_STATUS_CYCLE[(cIdx + 1) % ATT_STATUS_CYCLE.length];
  var key = employeeId + '|' + idx;
  ATT_GRID.pending[key] = { Employee_ID: employeeId, idx: idx, Status: next };
  btnEl.textContent = ATT_STATUS_LABEL[next] || '';
  btnEl.title = (ATT_STATUS_NAME[next] || '') + ' (klik untuk ganti)';
  btnEl.className = 'att-code ' + (next ? 'st-'+next : '');
  var td = btnEl.closest('td');
  if(td) td.classList.add('dirty');
  var saveBtn = document.getElementById('attSaveBtn');
  if(saveBtn) saveBtn.style.display = 'inline-block';
}
function saveAttendanceGrid(){
  var res = ATT_GRID.data;
  var changes = Object.keys(ATT_GRID.pending).map(function(k){
    var c = ATT_GRID.pending[k];
    return { Employee_ID: c.Employee_ID, Date: res.dayMeta[c.idx].date, Status: c.Status };
  });
  if(!changes.length){ toast('WARNING','Tidak ada perubahan untuk disimpan.'); return; }
  call('bulkUpsertAttendance', STATE.token, changes).then(function(r){
    toast('SUCCESS', r.saved + ' data absensi tersimpan.');
    loadAttendanceGrid();
  });
}

        '<option value="S">S - Sakit</option><option value="A">A - Alpha/Mangkir</option><option value="C">C - Cuti</option>' +
        '<option value="T">T - Telat</option><option value="N">N - 1/2 Hari</option><option value="B">B - Belum Bekerja</option>' +

function submitAttendanceForm(){
  var record = {
    Employee_ID: document.getElementById('afEmp').value, Date: document.getElementById('afDate').value,
    Status: document.getElementById('afStatus').value, Check_In: document.getElementById('afIn').value,
    Check_Out: document.getElementById('afOut').value, Notes: document.getElementById('afNotes').value
  };
  call('upsertAttendance', STATE.token, record).then(function(){ toast('SUCCESS','Attendance tersimpan.'); closeModal(); loadAttendanceGrid(); });
}

    return call('getBookPeriod', STATE.token);

    var isMgmt = ['OWNER','MANAGER','SUPERVISOR','ADMIN'].indexOf(STATE.role) !== -1;
    var options = isMgmt ? activeEmps_().map(function(e){ return '<option value="'+e.Employee_ID+'">'+esc(e.Name)+'</option>'; }).join('') : '';
    var body = (isMgmt ? '<div class="formrow"><label>Karyawan</label><select class="input" id="rcEmp">'+options+'</select></div>' : '') +
      '<div class="formrow"><label>Dari Tanggal</label><input type="date" class="input" id="rcStart" value="'+period.start+'"></div>' +
      '<div class="formrow"><label>Sampai Tanggal</label><input type="date" class="input" id="rcEnd" value="'+period.end+'"></div>' +
      '<p class="muted" style="font-size:12px;margin:-6px 0 6px;">Default mengikuti periode tutup buku perusahaan (tanggal '+period.cutoffDay+') - bisa diganti bebas.</p>' +
      '<div id="rcResult"></div>';
    openModal('Rekap Attendance', body, '<button class="btn secondary" onclick="closeModal()">Tutup</button><button class="btn" onclick="loadRecap()">Tampilkan</button>');

function loadRecap(){

      '<div class="k">Alpha (A)</div><div>'+r.A+'</div><div class="k">Cuti (C)</div><div>'+r.C+'</div>' +
      '<div class="k">Telat (T)</div><div>'+r.T+'</div><div class="k">1/2 Hari (N)</div><div>'+r.N+'</div>' +
      '<div class="k">Belum Bekerja (B)</div><div>'+r.B+'</div></div>';
  });
}

/*************************************************************************************************
 * MODULE: SHIFT SCHEDULE (jadwal shift/off planning grid - separate from real Attendance)
 *************************************************************************************************/
var SHIFT_GRID = { periodStart: null, periodEnd: null, data: null, pending: {}, recap: null };
var SHIFT_DOW_OPTIONS = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
RENDERERS.shiftschedule = function(){
  var isMgmt = ['OWNER','MANAGER','SUPERVISOR','ADMIN'].indexOf(STATE.role) !== -1;
  var html = '<div class="card" style="margin-bottom:14px;"><p class="muted" style="margin:0;font-size:13px;">' +
    'Jadwal ini adalah <b>rencana</b> hari kerja/off karyawan per periode. Data kehadiran/off yang sebenarnya tetap mengacu ke menu <b>Attendance</b> - ' +
    'karyawan tetap bisa saja masuk di hari jadwal off-nya (tukar jadwal / mengumpulkan jatah off untuk periode lain), atau off di luar jadwal.' +
    '</p></div>';
  html += '<div class="card" style="margin-bottom:14px;"><div class="toolbar" style="align-items:center;flex-wrap:wrap;margin:0;">' +
    '<label style="font-size:12px;color:#666;">Periode</label>' +
    '<input type="date" class="input" id="shiftStart" style="width:150px;">' +
    '<span class="muted">s/d</span>' +
    '<input type="date" class="input" id="shiftEnd" style="width:150px;">' +
    '<button class="btn secondary" onclick="applyShiftPeriod()">&#128269; Tampilkan</button>' +
    (isMgmt ? '<button class="btn success" id="shiftSaveBtn" onclick="saveShiftGrid()" style="display:none;">&#128190; Simpan Perubahan</button>' : '') +
    '</div><p class="muted" style="font-size:12px;margin:8px 0 0;">Default mengikuti periode tutup buku perusahaan (diatur di Settings) - misal 26 Juli - 25 Agustus dianggap sebagai "periode Agustus". Bisa diganti bebas.</p></div>' +
    '<div id="shiftTableWrap" class="tbl-wrap"></div><div id="shiftRecapWrap" style="margin-top:16px;"></div>';
  document.getElementById('content').innerHTML = html;
  if(!isMgmt){
    document.getElementById('shiftTableWrap').insertAdjacentHTML('beforebegin', '<div id="shiftMyInfoWrap" style="margin-bottom:14px;"></div>');
  }
  call('getBookPeriod', STATE.token).then(function(p){
    SHIFT_GRID.periodStart = SHIFT_GRID.periodStart || p.start;
    SHIFT_GRID.periodEnd = SHIFT_GRID.periodEnd || p.end;
    document.getElementById('shiftStart').value = SHIFT_GRID.periodStart;
    document.getElementById('shiftEnd').value = SHIFT_GRID.periodEnd;
    loadShiftGrid();
    fetchShiftScheduleRecap();
  });
};
function applyShiftPeriod(){
  SHIFT_GRID.periodStart = document.getElementById('shiftStart').value;
  SHIFT_GRID.periodEnd = document.getElementById('shiftEnd').value;
  if(!SHIFT_GRID.periodStart || !SHIFT_GRID.periodEnd || SHIFT_GRID.periodStart > SHIFT_GRID.periodEnd){
    toast('WARNING','Periode tidak valid.'); return;
  }
  loadShiftGrid();
  fetchShiftScheduleRecap();
}
function loadShiftGrid(){
  SHIFT_GRID.pending = {};
  var btn = document.getElementById('shiftSaveBtn');
  if(btn) btn.style.display = 'none';
  document.getElementById('shiftTableWrap').innerHTML = '<div class="empty-state">Memuat jadwal shift...</div>';
  ensureEmployeesCache().then(function(){
    return call('getShiftSchedule', STATE.token, SHIFT_GRID.periodStart, SHIFT_GRID.periodEnd);
  }).then(function(res){
    SHIFT_GRID.data = res;
    renderShiftGrid();
  }).catch(function(err){
    document.getElementById('shiftTableWrap').innerHTML = '<div class="card"><p class="muted">Gagal memuat data: '+esc((err&&err.message)||'')+'</p></div>';
  });
}
/** Client-side mirror of the server's weekly off-day pattern generation, so
 * picking a pattern fills the grid instantly without a round trip. Operates
 * across the FULL currently-displayed period (which may span two calendar
 * months) - not a single month. */
function generateDaysCodeClientForPeriod(offDay){
  var code = '';
  SHIFT_GRID.data.dayMeta.forEach(function(dm){
    code += (dm.dow === Number(offDay)) ? 'O' : 'P';
  });
  return code;
}
/** Current proposed state for an employee's period: pending edit if any (not
 * yet saved), otherwise their last-loaded/saved state from the server. */
function getEffectiveShiftRow(employeeId){
  var original = SHIFT_GRID.data.rows.filter(function(r){ return r.Employee_ID===employeeId; })[0];
  var p = SHIFT_GRID.pending[employeeId];
  if(p) return p;
  return { Off_Day: original.Off_Day, Backup_PIC_ID: original.Backup_PIC_ID, Days_Code: original.Days_Code,
    Shift_Start: original.Shift_Start, Shift_End: original.Shift_End };
}
function markShiftDirty(){
  var btn = document.getElementById('shiftSaveBtn');
  if(btn) btn.style.display = 'inline-block';
}
function stageShiftOffDay(employeeId, offDay){
  var eff = getEffectiveShiftRow(employeeId);
  var newCode = offDay ? generateDaysCodeClientForPeriod(offDay) : new Array(SHIFT_GRID.data.dayMeta.length+1).join('P');
  SHIFT_GRID.pending[employeeId] = { Off_Day: offDay, Backup_PIC_ID: eff.Backup_PIC_ID, Days_Code: newCode, Shift_Start: eff.Shift_Start, Shift_End: eff.Shift_End };
  markShiftDirty();
  renderShiftGrid();
}
function stageShiftBackup(employeeId, backupId){
  var eff = getEffectiveShiftRow(employeeId);
  SHIFT_GRID.pending[employeeId] = { Off_Day: eff.Off_Day, Backup_PIC_ID: backupId, Days_Code: eff.Days_Code, Shift_Start: eff.Shift_Start, Shift_End: eff.Shift_End };
  markShiftDirty();
  renderShiftGrid();
}
function stageShiftStart(employeeId, value){
  var eff = getEffectiveShiftRow(employeeId);
  SHIFT_GRID.pending[employeeId] = { Off_Day: eff.Off_Day, Backup_PIC_ID: eff.Backup_PIC_ID, Days_Code: eff.Days_Code, Shift_Start: value, Shift_End: eff.Shift_End };
  markShiftDirty();
}
function stageShiftEnd(employeeId, value){
  var eff = getEffectiveShiftRow(employeeId);
  SHIFT_GRID.pending[employeeId] = { Off_Day: eff.Off_Day, Backup_PIC_ID: eff.Backup_PIC_ID, Days_Code: eff.Days_Code, Shift_Start: eff.Shift_Start, Shift_End: value };
  markShiftDirty();
}
function stageShiftDayToggle(employeeId, idx){
  var eff = getEffectiveShiftRow(employeeId);
  var code = eff.Days_Code;
  var newChar = code[idx]==='O' ? 'P' : 'O';
  var newCode = code.substring(0,idx) + newChar + code.substring(idx+1);
  SHIFT_GRID.pending[employeeId] = { Off_Day: eff.Off_Day, Backup_PIC_ID: eff.Backup_PIC_ID, Days_Code: newCode, Shift_Start: eff.Shift_Start, Shift_End: eff.Shift_End };
  markShiftDirty();
  renderShiftGrid();
}
function renderShiftGrid(){
  var isMgmt = ['OWNER','MANAGER','SUPERVISOR','ADMIN'].indexOf(STATE.role) !== -1;
  var res = SHIFT_GRID.data;
  if(!res) return;
  if(!isMgmt && document.getElementById('shiftMyInfoWrap')){
    var myRow = res.rows[0]; // server already scopes non-management callers to their own row only
    var infoHtml;
    if(!myRow){
      infoHtml = '<div class="card"><p class="muted" style="margin:0;">Data jadwal Anda tidak ditemukan.</p></div>';
    } else {
      var myStart = myRow.Shift_Start || res.defaultShiftStart;
      var myEnd = myRow.Shift_End || res.defaultShiftEnd;
      var isCustom = !!(myRow.Shift_Start || myRow.Shift_End);
      infoHtml = '<div class="card" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;">' +
        '<div><div class="muted" style="font-size:12px;">&#128337; Jam Masuk</div><div style="font-size:20px;font-weight:700;">'+esc(myStart||'-')+'</div></div>' +
        '<div><div class="muted" style="font-size:12px;">&#128337; Jam Pulang</div><div style="font-size:20px;font-weight:700;">'+esc(myEnd||'-')+'</div></div>' +
        '<div class="muted" style="font-size:12px;">'+(isCustom ? 'Jam shift khusus Anda.' : 'Mengikuti jam kerja standar perusahaan (belum ada jadwal khusus).')+'</div>' +
        '</div>';
    }
    document.getElementById('shiftMyInfoWrap').innerHTML = infoHtml;
  }
  var html = '<div class="att-grid-wrap"><table class="att-grid shift-grid"><thead>' +
    '<tr><th class="att-name-h" rowspan="2">Nama Karyawan</th>' +
      (isMgmt ? '<th rowspan="2">Hari Off</th><th rowspan="2">PIC Backup</th><th rowspan="2">Jam Masuk</th><th rowspan="2">Jam Pulang</th>' : '') +
      '<th colspan="'+res.dayMeta.length+'">Tanggal</th></tr>' +
    '<tr>' + res.dayMeta.map(function(dm){
      var cls = dm.isHoliday ? 'shift-dow-h holiday' : (dm.isWeekend ? 'shift-dow-h weekend' : 'shift-dow-h');
      var title = dm.isHoliday ? esc(dm.holidayNames.join(', ')) : (dm.isWeekend ? 'Akhir pekan' : '');
      return '<th class="'+cls+'" title="'+title+'">'+dm.day+'<br><span class="dow">'+dm.dowLabel+'</span></th>';
    }).join('') + '</tr>' +
    '</thead><tbody>';
  if(!res.rows.length){
    html += '<tr><td colspan="'+(res.dayMeta.length + (isMgmt?5:1))+'" class="empty-state">Tidak ada karyawan aktif.</td></tr>';
  }
  res.rows.forEach(function(row){
    var eff = isMgmt ? getEffectiveShiftRow(row.Employee_ID) : { Off_Day: row.Off_Day, Backup_PIC_ID: row.Backup_PIC_ID, Days_Code: row.Days_Code };
    var isDirty = isMgmt && !!SHIFT_GRID.pending[row.Employee_ID];
    html += '<tr'+(isDirty?' class="shift-row-dirty"':'')+'><td class="att-name"><span class="nm">'+esc(row.Name)+(isDirty?' <span class="muted" style="font-size:10px;">(belum disimpan)</span>':'')+'</span><span class="pos">'+esc(row.Position||'')+'</span></td>';
    if(isMgmt){
      html += '<td style="min-width:110px;"><select class="input sm" onchange="stageShiftOffDay(\''+row.Employee_ID+'\',this.value)">' +
        '<option value="">-</option>' + SHIFT_DOW_OPTIONS.map(function(name,i){ return '<option value="'+(i+1)+'"'+(String(eff.Off_Day)===String(i+1)?' selected':'')+'>'+name+'</option>'; }).join('') + '</select></td>';
      html += '<td style="min-width:130px;"><select class="input sm" onchange="stageShiftBackup(\''+row.Employee_ID+'\',this.value)">' +
        empOptionsExclude(eff.Backup_PIC_ID, row.Employee_ID) + '</select></td>';
      html += '<td style="min-width:100px;"><input type="time" class="input sm" value="'+esc(eff.Shift_Start||'')+'" placeholder="'+esc(res.defaultShiftStart||'')+'" title="Kosongkan untuk pakai default perusahaan ('+esc(res.defaultShiftStart||'')+')" onchange="stageShiftStart(\''+row.Employee_ID+'\',this.value)"></td>';
      html += '<td style="min-width:100px;"><input type="time" class="input sm" value="'+esc(eff.Shift_End||'')+'" placeholder="'+esc(res.defaultShiftEnd||'')+'" title="Kosongkan untuk pakai default perusahaan ('+esc(res.defaultShiftEnd||'')+')" onchange="stageShiftEnd(\''+row.Employee_ID+'\',this.value)"></td>';
    }
    eff.Days_Code.split('').forEach(function(code, idx){
      var dm = res.dayMeta[idx];
      var restricted = code==='O' && (dm.isWeekend || dm.isHoliday);
      var extraCls = (dm.isHoliday||dm.isWeekend) ? ' shift-col-flag' : '';
      var title = restricted ? ('Off di '+(dm.isHoliday?dm.holidayNames.join(', '):(dm.dow===6?'Sabtu':'Minggu'))+' - perlu persetujuan Owner/Manager') : (ATT_STATUS_NAME[code]||'');
      if(isMgmt){
        html += '<td class="att-cell'+extraCls+'"><button type="button" class="att-code st-'+code+(restricted?' shift-flagged':'')+'" title="'+esc(title)+' (klik untuk ganti)" ' +
          'onclick="onShiftCellClick(\''+row.Employee_ID+'\','+idx+')">'+code+'</button></td>';
      } else {
        html += '<td class="'+extraCls.trim()+'"><span class="att-readonly st-'+code+'" title="'+esc(title)+'">'+code+'</span></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="muted att-legend" style="margin-top:10px;font-size:12px;">' +
    '<span class="att-code st-P" style="cursor:default;">P</span> Hadir/Terjadwal Kerja &nbsp; ' +
    '<span class="att-code st-O" style="cursor:default;">O</span> Libur/Off Terjadwal &nbsp; ' +
    '<span class="shift-legend-dot weekend"></span> Sabtu/Minggu &nbsp; ' +
    '<span class="shift-legend-dot holiday"></span> Hari Libur Nasional / Cuti Bersama' +
    (isMgmt ? '<br>Pilih Hari Off atau klik sel tanggal untuk mengubah rencana - perubahan baru tersimpan setelah klik "Simpan Perubahan".' : '') + '</div>';
  document.getElementById('shiftTableWrap').innerHTML = html;
}
function empOptionsExclude(selectedId, excludeId){
  return '<option value="">-</option>' + activeEmps_().filter(function(e){ return String(e.Employee_ID)!==String(excludeId); })
    .map(function(e){ return '<option value="'+e.Employee_ID+'"'+(String(e.Employee_ID)===String(selectedId)?' selected':'')+'>'+esc(e.Name)+'</option>'; }).join('');
}
function onShiftCellClick(employeeId, idx){
  var eff = getEffectiveShiftRow(employeeId);
  var willBecomeO = eff.Days_Code[idx] !== 'O';
  var dm = SHIFT_GRID.data.dayMeta[idx];
  var proceed = function(){ stageShiftDayToggle(employeeId, idx); };
  if(willBecomeO && (dm.isWeekend || dm.isHoliday)){

/**
 * Human-readable deadline label per period, shown in Detail Tugas:
 *  - daily: due today at Due_Time (daily deadlines are always "today")
 *  - weekly: the recurring weekday (Day_Of_Week, 1=Senin..7=Minggu) + Due_Time,
 *    e.g. a task due "every Friday 16:00" - not a specific calendar date
 *  - monthly: the recurring day-of-month (Day_Of_Month) + Due_Time,
 *    e.g. a task due "every 25th of the month"
 */
var TASK_DOW_NAMES_ = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
function taskDeadlineLabel(period, t){
  var time = t.Due_Time ? (t.Due_Time+' WITA') : 'jam belum diatur';
  if(period === 'daily') return 'Hari ini, '+time;
  if(period === 'weekly'){
    var dowIdx = Number(t.Day_Of_Week);
    var dowName = (dowIdx>=1 && dowIdx<=7) ? TASK_DOW_NAMES_[dowIdx-1] : null;
    return dowName ? ('Setiap hari '+dowName+', '+time) : ('Hari belum diatur, '+time);
  }
  if(period === 'monthly'){
    var dom = t.Day_Of_Month;
    return dom ? ('Setiap tanggal '+dom+', '+time) : ('Tanggal belum diatur, '+time);
  }
  return t.Due_Time || '-';
}

function bulkTaskActionNow(period, action){
  var records = window.__lastTaskRecords || [];
  var eligible = records.filter(function(t){ return action==='start' ? t.Status==='PENDING' : t.Status==='IN_PROGRESS'; }).map(function(t){ return t.Task_Instance_ID; });
  if(!eligible.length){ toast('WARNING', action==='start' ? 'Tidak ada task berstatus PENDING.' : 'Tidak ada task berstatus IN_PROGRESS.'); return; }
  var verb = action==='start' ? 'memulai' : 'menyelesaikan';
  confirmAction('Yakin ingin '+verb+' '+eligible.length+' task sekaligus?', function(){
    call('bulkTaskAction', STATE.token, period, action, eligible).then(function(r){
      toast(r.failed ? 'WARNING' : 'SUCCESS', r.done + ' task ' + (action==='start'?'dimulai':'diselesaikan') + (r.failed ? ', ' + r.failed + ' gagal.' : '.'));
      loadTaskTable(period, window.__lastTaskCat||'');
    });
  });
}

/*************************************************************************************************
 * SHARED IMPORT / EXPORT WIDGET
 * Reusable across every module: download a CSV template, upload/paste data,
 * preview validation results, commit the import, and export the module's
 * current data as CSV / PDF / XLSX.
 *************************************************************************************************/
function importExportToolbarHtml(importType, reportKey){
  var btns = '';
  if(importType) btns += '<button class="btn secondary" onclick="openImportModal(\''+importType+'\')">&#11014; Import</button> ';
  if(reportKey) btns += '<button class="btn secondary" onclick="openExportModal(\''+reportKey+'\')">&#11015; Export</button>';
  return btns;
}
function downloadTextFile(filename, content, mime){
  var blob = new Blob([content], { type: mime || 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function csvTextToAoa_(csv){
  return csv.split(/\r?\n/).filter(function(l){ return l.length; }).map(function(line){
    // simple CSV split that respects quoted commas
    var result = []; var cur = ''; var inQ = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(ch === '"'){ if(inQ && line[i+1]=== '"'){ cur+='"'; i++; } else { inQ = !inQ; } }
      else if(ch === ',' && !inQ){ result.push(cur); cur=''; }
      else cur += ch;
    }
    result.push(cur);
    return result;
  });
}
function downloadImportTemplate(type){
  call('getImportTemplate', STATE.token, type).then(function(r){
    var aoa = csvTextToAoa_(r.csv);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Template');
    XLSX.writeFile(wb, r.filename.replace(/\.csv$/i, '.xlsx'));
  });
}
function openImportModal(type){
  var body = '<div class="formrow"><button class="btn secondary" onclick="downloadImportTemplate(\''+type+'\')">&#11015; Download Template Excel (.xlsx)</button></div>' +
    '<div class="dropzone" id="impDropzone2" onclick="document.getElementById(\'impFile2\').click()">Klik untuk memilih file Excel (.xlsx / .xls) hasil isian template</div>' +
    '<input type="file" id="impFile2" accept=".xlsx,.xls" style="display:none" onchange="handleImportFile2(event)">' +
    '<div class="muted" id="impFileName2" style="margin-top:8px;font-size:12px;"></div>' +
    '<div id="impPreviewWrap2" style="margin-top:14px;"></div>';
  IMPORT_STATE.csv = '';
  openModal('Import Data (Excel)', body,
    '<button class="btn secondary" onclick="closeModal()">Tutup</button>' +
    '<button class="btn secondary" onclick="previewImportData2(\''+type+'\')">Preview</button>' +
    '<button class="btn" id="impCommitBtn2" style="display:none;" onclick="commitImportData2(\''+type+'\')">Import Sekarang</button>');
}
var IMPORT_STATE = { csv: '' };
function handleImportFile2(e){
  var file = e.target.files[0];
  if(!file) return;
  document.getElementById('impFileName2').textContent = 'File dipilih: ' + file.name;
  var reader = new FileReader();
  reader.onload = function(evt){
    try {
      var data = new Uint8Array(evt.target.result);
      var wb = XLSX.read(data, { type: 'array' });
      var firstSheet = wb.SheetNames[0];
      var csv = XLSX.utils.sheet_to_csv(wb.Sheets[firstSheet]);
      IMPORT_STATE.csv = csv;
      toast('SUCCESS','File Excel berhasil dibaca. Klik Preview untuk validasi.');
    } catch(err){
      toast('ERROR','Gagal membaca file Excel: ' + (err.message || err));
    }
  };
  reader.readAsArrayBuffer(file);
}
