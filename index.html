/*************************************************************************************************
 * DATAGRID - form input berbentuk tabel (banyak baris sekaligus, seperti spreadsheet).
 * Dipakai oleh Employees, Assets, dan Task Master (mode Tambah = banyak baris, mode Edit = 1 baris).
 *
 * cfg = {
 *   title, subtitle, edit:Boolean, minRows:Number, saveLabel,
 *   columns:[{ key, label, group, type, required, w, hint, placeholder, default, options, blank,
 *              suggest, min, max, step, dependsOn, dynamic, onChange }],
 *   rows:[objek nilai awal] (mode edit),
 *   save: function(values, rowIndex) -> Promise   (dipanggil per baris, berurutan),
 *   onDone: function()                             (refresh tabel di belakang modal)
 * }
 * type: text | number | date | time | select | check | textarea | multi | readonly | dynamic
 *************************************************************************************************/
var DG = null;
var DG_POP = null;

function dgVal_(v){ return (typeof v === 'function') ? v() : v; }
function dgOptions_(col){
  var raw = dgVal_(col.options) || [];
  return raw.map(function(o){ return (typeof o === 'object') ? o : { v: o, l: o }; });
}
function dgEmpty_(v){ return v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length); }
function dgBool_(v){ return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1'; }
function dgCol_(key){ for(var i=0;i<DG.cfg.columns.length;i++){ if(DG.cfg.columns[i].key === key) return DG.cfg.columns[i]; } return null; }
function dgRow_(rid){ for(var i=0;i<DG.rows.length;i++){ if(DG.rows[i].id === rid) return DG.rows[i]; } return null; }

/** Konfigurasi sel yang berlaku untuk baris ini (kolom 'dynamic' berubah menurut nilai kolom lain). */
function dgCell_(col, vals){
  if(col.type !== 'dynamic') return col;
  var d = col.dynamic(vals) || { type: 'none' };
  var o = {}; for(var k in col){ o[k] = col[k]; } for(var k2 in d){ o[k2] = d[k2]; }
  return o;
}

function dgNewRow_(src){
  var vals = {};
  DG.cfg.columns.forEach(function(c){
    if(src && src[c.key] !== undefined && src[c.key] !== null){ vals[c.key] = src[c.key]; }
    else {
      var d = dgVal_(c.default);
      vals[c.key] = (d !== undefined) ? d : (c.type === 'multi' ? [] : (c.type === 'check' ? false : ''));
    }
  });
  return { id: 'r' + (++DG.seq), vals: vals, status: 'new', error: '' };
}

function dgInputHtml_(col, row){
  var cell = dgCell_(col, row.vals);
  var k = col.key, v = row.vals[k];
  var attr = ' data-k="' + esc(k) + '"';
  var ph = cell.placeholder ? ' placeholder="' + esc(cell.placeholder) + '"' : '';
  switch(cell.type){
    case 'none':
      return '<div class="dg-none">' + esc(cell.text || '—') + '</div>';
    case 'readonly':
      return '<input class="input dg-ro" readonly tabindex="-1"' + attr + ' value="' + esc(v) + '"' + ph + '>';
    case 'check':
      return '<label class="dg-chk"><input type="checkbox"' + attr + (dgBool_(v) ? ' checked' : '') + '></label>';
    case 'textarea':
      return '<textarea class="input dg-ta" rows="1"' + attr + ph + '>' + esc(v) + '</textarea>';
    case 'select':
      var opts = dgOptions_(cell), found = false, h = '';
      if(cell.blank !== undefined){ h += '<option value="">' + esc(cell.blank) + '</option>'; }
      opts.forEach(function(o){
        var sel = String(o.v) === String(v); if(sel) found = true;
        h += '<option value="' + esc(o.v) + '"' + (sel ? ' selected' : '') + '>' + esc(o.l) + '</option>';
      });
      // nilai lama yang tidak ada di daftar tetap ditampilkan agar tidak hilang saat edit
      if(!found && !dgEmpty_(v)){ h += '<option value="' + esc(v) + '" selected>' + esc(v) + '</option>'; }
      return '<select class="input"' + attr + '>' + h + '</select>';
    case 'multi':
      return '<button type="button" class="input dg-multi"' + attr + '>' + esc(dgMultiLabel_(cell, v)) + '</button>';
    default: // text, number, date, time
      var type = cell.type === 'number' ? 'number' : (cell.type === 'date' ? 'date' : (cell.type === 'time' ? 'time' : 'text'));
      var extra = '';
      if(type === 'number'){
        extra += ' step="' + (cell.step || 'any') + '"';
        if(cell.min !== undefined) extra += ' min="' + cell.min + '"';
        if(cell.max !== undefined) extra += ' max="' + cell.max + '"';
        extra += ' inputmode="decimal"';
      }
      if(type === 'time'){ extra += ' step="60"'; }
      if(type === 'date' && v){ v = String(v).substring(0, 10); }
      var list = '';
      if(cell.suggest){ list = ' list="dgl-' + esc(k) + '"'; }
      return '<input class="input" type="' + type + '"' + attr + ' value="' + esc(v) + '"' + ph + extra + list + '>';
  }
}

function dgMultiLabel_(col, ids){
  ids = ids || [];
  if(!ids.length) return 'Pilih…';
  var names = dgOptions_(col).filter(function(o){ return ids.indexOf(String(o.v)) !== -1; }).map(function(o){ return o.l; });
  if(names.length === 1) return names[0];
  return names.length + ' dipilih';
}

function dgRowHtml_(row, idx){
  var h = '<tr data-rid="' + row.id + '" class="' + (row.status !== 'new' ? 'dg-' + row.status : '') + '">';
  h += '<td class="dg-no" title="' + esc(row.error) + '">' + dgNoLabel_(row, idx) + '</td>';
  DG.cfg.columns.forEach(function(c){
    h += '<td data-k="' + esc(c.key) + '"' + (c.type === 'check' ? ' class="dg-tdc"' : '') + '>' + dgInputHtml_(c, row) + '</td>';
  });
  if(!DG.cfg.edit){ h += '<td class="dg-del"><button type="button" class="dg-x" title="Hapus baris" data-act="del">&times;</button></td>'; }
  return h + '</tr>';
}
function dgNoLabel_(row, idx){
  if(row.status === 'saved') return '<span class="dg-ok">&#10003;</span>';
  if(row.status === 'error') return '<span class="dg-err">!</span>';
  if(row.status === 'saving') return '<span class="dg-spin">&#8230;</span>';
  return String(idx + 1);
}

function openDataGrid(cfg){
  DG = { cfg: cfg, rows: [], seq: 0, busy: false };
  var n = cfg.rows && cfg.rows.length ? cfg.rows.length : (cfg.minRows || 3);
  for(var i = 0; i < n; i++){ DG.rows.push(dgNewRow_(cfg.rows ? cfg.rows[i] : null)); }

  var cols = cfg.columns, hasGroups = cols.some(function(c){ return c.group; });
  var th = '';
  if(hasGroups){
    var gh = '<tr class="dg-grow"><th class="dg-no"></th>', i2 = 0;
    while(i2 < cols.length){
      var g = cols[i2].group || '', span = 1;
      while(i2 + span < cols.length && (cols[i2 + span].group || '') === g){ span++; }
      gh += '<th colspan="' + span + '" class="dg-gh">' + esc(g) + '</th>';
      i2 += span;
    }
    th += gh + (cfg.edit ? '' : '<th class="dg-gh"></th>') + '</tr>';
  }
  th += '<tr><th class="dg-no dg-colh">#</th>';
  cols.forEach(function(c){
    th += '<th class="dg-colh" style="min-width:' + (c.w || 140) + 'px;">' + esc(c.label) +
      (c.required ? ' <span class="dg-req">*</span>' : '') +
      (c.hint ? ' <span class="dg-info" title="' + esc(c.hint) + '">&#9432;</span>' : '') + '</th>';
  });
  th += (cfg.edit ? '' : '<th class="dg-colh dg-delh"></th>') + '</tr>';

  var lists = '';
  cols.forEach(function(c){
    if(c.suggest){
      lists += '<datalist id="dgl-' + esc(c.key) + '">' + (dgVal_(c.suggest) || []).map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>';
    }
  });

  var body = '<div class="dg-top"><div class="dg-sub">' + esc(cfg.subtitle || '') + '</div>' +
    (cfg.edit ? '' : '<button type="button" class="btn secondary" onclick="dgAddRow()">+ Tambah Baris</button>') +
    '<button type="button" class="btn" id="dgSaveBtn" onclick="dgSaveAll()">&#128190; ' + esc(cfg.saveLabel || (cfg.edit ? 'Simpan' : 'Simpan Semua')) + '</button></div>' +
    '<div class="dg-wrap" id="dgWrap"><table class="dg' + (hasGroups ? ' has-groups' : '') + '" id="dgTable"><thead>' + th + '</thead><tbody id="dgBody">' +
    DG.rows.map(function(r, i){ return dgRowHtml_(r, i); }).join('') + '</tbody></table></div>' + lists;

  openModal(cfg.title, body, '');
  document.querySelector('#modalOverlay .modal').classList.add('wide');
  document.getElementById('modalFoot').style.display = 'none';

  var table = document.getElementById('dgTable');
  table.addEventListener('input', dgOnInput_);
  table.addEventListener('change', dgOnInput_);
  table.addEventListener('click', dgOnClick_);
  table.addEventListener('keydown', dgOnKey_);
  table.addEventListener('paste', dgOnPaste_);
  setTimeout(function(){ var f = table.querySelector('tbody input:not([readonly]):not([type=checkbox]),tbody textarea'); if(f){ f.focus(); } }, 50);
}

function dgRenumber_(){
  var trs = document.querySelectorAll('#dgBody tr');
  Array.prototype.forEach.call(trs, function(tr, i){
    var row = dgRow_(tr.getAttribute('data-rid'));
    if(row){ tr.querySelector('.dg-no').innerHTML = dgNoLabel_(row, i); }
  });
}
function dgAddRow(){
  if(!DG || DG.cfg.edit) return null;
  var row = dgNewRow_(null);
  DG.rows.push(row);
  var body = document.getElementById('dgBody');
  body.insertAdjacentHTML('beforeend', dgRowHtml_(row, DG.rows.length - 1));
  var wrap = document.getElementById('dgWrap');
  wrap.scrollTop = wrap.scrollHeight;
  return body.lastElementChild;
}
function dgRefreshRow_(row){
  var tr = document.querySelector('#dgBody tr[data-rid="' + row.id + '"]');
  if(!tr) return;
  var idx = DG.rows.indexOf(row);
  var tmp = document.createElement('tbody');
  tmp.innerHTML = dgRowHtml_(row, idx);
  tr.parentNode.replaceChild(tmp.firstChild, tr);
}

/** Mengisi satu nilai ke baris + jalankan hook onChange + render ulang kolom yang bergantung. */
function dgSet_(row, key, val, silent){
  row.vals[key] = val;
  var col = dgCol_(key);
  if(col && col.onChange && !silent){
    col.onChange(row.vals, function(k2, v2){ row.vals[k2] = v2; });
  }
}
function dgAfterChange_(row, key){
  // Hook onChange bisa mengubah kolom lain di baris yang sama (mis. Departemen otomatis dari PIC),
  // jadi semua sel lain di baris ini digambar ulang. Sel yang sedang diketik tidak disentuh.
  var tr = document.querySelector('#dgBody tr[data-rid="' + row.id + '"]');
  if(!tr) return;
  DG.cfg.columns.forEach(function(c){
    if(c.key === key) return;
    var td = tr.querySelector('td[data-k="' + c.key + '"]');
    if(td){ td.innerHTML = dgInputHtml_(c, row); }
  });
}

function dgOnInput_(e){
  var el = e.target;
  var k = el.getAttribute && el.getAttribute('data-k');
  if(!k || el.classList.contains('dg-multi')) return;
  var tr = el.closest('tr'); if(!tr) return;
  var row = dgRow_(tr.getAttribute('data-rid')); if(!row || row.status === 'saved') return;
  var val = el.type === 'checkbox' ? el.checked : el.value;
  // select/checkbox: perubahan final; text: tiap ketikan
  dgSet_(row, k, val);
  el.classList.remove('dg-bad');
  var col = dgCol_(k);
  if(col && (col.onChange || DG.cfg.columns.some(function(c){ return c.dependsOn === k; }))){ dgAfterChange_(row, k); }
  if(row.status === 'error'){ row.status = 'new'; row.error = ''; tr.className = ''; dgRenumber_(); }
}

function dgOnClick_(e){
  var t = e.target;
  var del = t.closest && t.closest('[data-act="del"]');
  if(del){
    if(DG.busy) return;
    var tr = del.closest('tr'), row = dgRow_(tr.getAttribute('data-rid'));
    if(DG.rows.length <= 1){ // sisakan satu baris kosong
      DG.rows = [dgNewRow_(null)];
      document.getElementById('dgBody').innerHTML = dgRowHtml_(DG.rows[0], 0);
      return;
    }
    DG.rows.splice(DG.rows.indexOf(row), 1);
    tr.parentNode.removeChild(tr);
    dgRenumber_();
    return;
  }
  var mb = t.closest && t.closest('.dg-multi');
  if(mb){ dgOpenMulti_(mb); }
}

function dgOnKey_(e){
  if(e.key !== 'Enter') return;
  var el = e.target;
  if(!el.matches || !el.matches('input:not([type=checkbox]):not([readonly])')) return;
  e.preventDefault();
  var tr = el.closest('tr'), k = el.getAttribute('data-k');
  var next = tr.nextElementSibling;
  if(!next && !DG.cfg.edit){ next = dgAddRow(); }
  if(next){
    var target = next.querySelector('[data-k="' + k + '"]');
    if(target && target.focus){ target.focus(); if(target.select){ target.select(); } }
  }
}

/* ---------- Tempel (paste) dari Excel / Google Sheets: tab = kolom, baris baru = baris ---------- */
function dgParseDate_(s){
  s = String(s).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2); // dd/mm/yyyy
  return '';
}
function dgParseNumber_(s){
  s = String(s).trim().replace(/[^\d.,\-]/g, '');
  if(/^-?\d{1,3}([.,]\d{3})+$/.test(s)) return s.replace(/[.,]/g, '');
  return s.replace(',', '.');
}
function dgCoerce_(cell, raw, vals){
  raw = String(raw === undefined ? '' : raw).trim();
  switch(cell.type){
    case 'number': return dgParseNumber_(raw);
    case 'date': return dgParseDate_(raw);
    case 'check': return /^(1|true|ya|y|yes|x|v|✓)$/i.test(raw);
    case 'select':
      var hit = dgOptions_(cell).filter(function(o){ return String(o.v).toLowerCase() === raw.toLowerCase() || String(o.l).toLowerCase() === raw.toLowerCase(); })[0];
      return hit ? String(hit.v) : (dgEmpty_(raw) ? '' : null);
    case 'multi':
      var wanted = raw.split(/[;,]/).map(function(x){ return x.trim().toLowerCase(); }).filter(Boolean);
      return dgOptions_(cell).filter(function(o){ return wanted.indexOf(String(o.l).toLowerCase()) !== -1 || wanted.indexOf(String(o.v).toLowerCase()) !== -1; }).map(function(o){ return String(o.v); });
    default: return raw;
  }
}
function dgOnPaste_(e){
  var el = e.target;
  if(!el.getAttribute || !el.getAttribute('data-k') || el.type === 'checkbox' || el.readOnly) return;
  var text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text || (text.indexOf('\t') === -1 && text.indexOf('\n') === -1)) return; // tempel biasa
  e.preventDefault();
  var lines = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(function(l){ return l.split('\t'); });
  var tr = el.closest('tr'), startRow = DG.rows.indexOf(dgRow_(tr.getAttribute('data-rid')));
  var cols = DG.cfg.columns, startCol = -1;
  cols.forEach(function(c, i){ if(c.key === el.getAttribute('data-k')) startCol = i; });
  if(startCol < 0) return;
  var touched = [], skipped = 0;
  lines.forEach(function(cells, ri){
    var rIdx = startRow + ri;
    while(rIdx >= DG.rows.length){
      if(DG.cfg.edit) return;
      var nr = dgNewRow_(null); DG.rows.push(nr);
      document.getElementById('dgBody').insertAdjacentHTML('beforeend', dgRowHtml_(nr, DG.rows.length - 1));
    }
    var row = DG.rows[rIdx]; if(row.status === 'saved') return;
    cells.forEach(function(raw, ci){
      var col = cols[startCol + ci]; if(!col) return;
      var cell = dgCell_(col, row.vals);
      if(cell.type === 'readonly' || cell.type === 'none') return;
      var v = dgCoerce_(cell, raw, row.vals);
      if(v === null){ skipped++; return; }
      dgSet_(row, col.key, v);
    });
    if(touched.indexOf(row) === -1) touched.push(row);
  });
  touched.forEach(dgRefreshRow_);
  dgRenumber_();
  toast(skipped ? 'WARNING' : 'INFO', lines.length + ' baris ditempel' + (skipped ? ' (' + skipped + ' sel tidak cocok dengan pilihan dan dilewati)' : '.'));
}

/* ---------- Multi-pilih (Consulted / Informed) ---------- */
function dgClosePop_(){ if(DG_POP){ DG_POP.remove(); DG_POP = null; } }
function dgOpenMulti_(btn){
  dgClosePop_();
  var tr = btn.closest('tr'), row = dgRow_(tr.getAttribute('data-rid'));
  if(!row || row.status === 'saved') return;
  var col = dgCol_(btn.getAttribute('data-k'));
  var cur = (row.vals[col.key] || []).map(String);
  var pop = document.createElement('div');
  pop.className = 'dg-pop';
  pop.innerHTML = dgOptions_(col).map(function(o){
    return '<label><input type="checkbox" value="' + esc(o.v) + '"' + (cur.indexOf(String(o.v)) !== -1 ? ' checked' : '') + '> ' + esc(o.l) + '</label>';
  }).join('') || '<div class="muted" style="padding:8px;">Tidak ada pilihan.</div>';
  document.body.appendChild(pop);
  var r = btn.getBoundingClientRect();
  var top = r.bottom + 2, maxH = Math.max(140, window.innerHeight - top - 12);
  if(maxH < 180 && r.top > window.innerHeight / 2){ top = Math.max(8, r.top - 230); maxH = 226; }
  pop.style.cssText = 'left:' + Math.min(r.left, window.innerWidth - 250) + 'px;top:' + top + 'px;max-height:' + maxH + 'px;min-width:' + Math.max(r.width, 200) + 'px;';
  pop.addEventListener('change', function(){
    var ids = Array.prototype.filter.call(pop.querySelectorAll('input'), function(i){ return i.checked; }).map(function(i){ return i.value; });
    row.vals[col.key] = ids;
    btn.textContent = dgMultiLabel_(col, ids);
  });
  DG_POP = pop;
  setTimeout(function(){
    document.addEventListener('mousedown', dgPopOutside_, true);
    var w = document.getElementById('dgWrap'); if(w){ w.addEventListener('scroll', dgClosePop_, { once: true }); }
  }, 0);
}
function dgPopOutside_(e){
  if(DG_POP && !DG_POP.contains(e.target)){ dgClosePop_(); document.removeEventListener('mousedown', dgPopOutside_, true); }
}

/* ---------- Simpan ---------- */
function dgIsBlank_(row){
  return DG.cfg.columns.every(function(c){
    var cell = dgCell_(c, row.vals);
    if(cell.type === 'readonly' || cell.type === 'none') return true;
    var v = row.vals[c.key], d = dgVal_(c.default);
    if(d === undefined){ d = (c.type === 'multi') ? [] : (c.type === 'check' ? false : ''); }
    if(Array.isArray(v)) return v.length === (d || []).length && v.every(function(x, i){ return String(x) === String((d || [])[i]); });
    if(c.type === 'check') return dgBool_(v) === dgBool_(d);
    return String(v === undefined || v === null ? '' : v).trim() === String(d === undefined || d === null ? '' : d).trim();
  });
}
function dgMissing_(row){
  var miss = [];
  DG.cfg.columns.forEach(function(c){
    var cell = dgCell_(c, row.vals);
    if(!c.required || cell.type === 'none') return;
    var v = row.vals[c.key];
    if(dgEmpty_(typeof v === 'string' ? v.trim() : v)){ miss.push(c.key); }
  });
  return miss;
}
function dgMarkBad_(row, keys){
  var tr = document.querySelector('#dgBody tr[data-rid="' + row.id + '"]'); if(!tr) return;
  keys.forEach(function(k){
    var inp = tr.querySelector('td[data-k="' + k + '"] .input');
    if(inp){ inp.classList.add('dg-bad'); }
  });
}
function dgSetStatus_(row, status, error){
  row.status = status; row.error = error || '';
  var tr = document.querySelector('#dgBody tr[data-rid="' + row.id + '"]'); if(!tr) return;
  tr.className = status === 'new' ? '' : 'dg-' + status;
  var no = tr.querySelector('.dg-no');
  no.title = row.error;
  no.innerHTML = dgNoLabel_(row, DG.rows.indexOf(row));
  if(status === 'saved'){
    Array.prototype.forEach.call(tr.querySelectorAll('input,select,textarea,button.dg-multi'), function(i){ i.disabled = true; });
    var x = tr.querySelector('.dg-x'); if(x){ x.style.visibility = 'hidden'; }
  }
}
function dgSaveAll(){
  if(!DG || DG.busy) return;
  var cfg = DG.cfg, todo = [], invalid = [];
  DG.rows.forEach(function(r){
    if(r.status === 'saved') return;
    if(dgIsBlank_(r)) return;
    var miss = dgMissing_(r);
    if(miss.length){ invalid.push(r); dgMarkBad_(r, miss); dgSetStatus_(r, 'error', 'Kolom bertanda * wajib diisi.'); }
    else { todo.push(r); }
  });
  if(invalid.length){
    var first = document.querySelector('#dgBody .dg-bad');
    if(first){ first.scrollIntoView({ block: 'nearest', inline: 'nearest' }); first.focus(); }
  }
  if(!todo.length){
    toast('WARNING', invalid.length ? invalid.length + ' baris belum lengkap (kolom bertanda *).' : 'Belum ada data yang diisi.');
    return;
  }
  DG.busy = true;
  var btn = document.getElementById('dgSaveBtn');
  var ok = 0, fail = 0;
  (function next(i){
    if(i >= todo.length){ return finish(); }
    var row = todo[i];
    if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan ' + (i + 1) + '/' + todo.length + '…'; }
    dgSetStatus_(row, 'saving');
    Promise.resolve().then(function(){ return cfg.save(row.vals, DG.rows.indexOf(row)); }).then(function(){
      ok++; dgSetStatus_(row, 'saved');
    }, function(err){
      fail++; dgSetStatus_(row, 'error', (err && err.message) ? err.message : 'Gagal menyimpan.');
    }).then(function(){ next(i + 1); });
  })(0);
  function finish(){
    DG.busy = false;
    if(btn){ btn.disabled = false; btn.innerHTML = '&#128190; ' + esc(cfg.saveLabel || (cfg.edit ? 'Simpan' : 'Simpan Semua')); }
    if(!fail && !invalid.length){
      toast('SUCCESS', ok + (cfg.edit ? ' data tersimpan.' : ' baris berhasil disimpan.'));
      closeModal();
      if(cfg.onDone) cfg.onDone();
      return;
    }
    toast('WARNING', ok + ' tersimpan, ' + (fail + invalid.length) + ' belum. Baris bertanda ! perlu diperbaiki lalu klik simpan lagi.');
    if(ok && cfg.onDone) cfg.onDone();
  }
}

function dgUniq_(list, key){
  var seen = {}, out = [];
  (list || []).forEach(function(x){ var v = String(x[key] || '').trim(); if(v && !seen[v.toLowerCase()]){ seen[v.toLowerCase()] = 1; out.push(v); } });
  return out.sort();
}

      { key: 'Sort_Order', group: G4, label: 'Urutan', type: 'number', w: 90, default: 0 },
      { key: 'Description', group: G4, label: 'Deskripsi', type: 'textarea', w: 220 },
      { key: 'Output', group: G4, label: 'Output', type: 'textarea', w: 220, hint: 'Hasil yang diharapkan dari tugas ini.' },
      { key: 'Accountable', group: G5, label: 'Accountable', type: 'select', w: 180, blank: empBlank, options: dgEmpOptions_, hint: 'Penanggung jawab hasil. Responsible = Primary/Backup PIC.' },
      { key: 'Consulted', group: G5, label: 'Consulted', type: 'multi', w: 170, options: dgEmpOptions_, hint: 'Pihak yang dikonsultasikan.' },
      { key: 'Informed', group: G5, label: 'Informed', type: 'multi', w: 170, options: dgEmpOptions_, hint: 'Pihak yang diberi informasi.' },
      { key: 'Authority_Level', group: G6, label: 'Authority Level', type: 'select', w: 140, blank: '—',
        options: [{ v: 'STAFF', l: 'Staff' }, { v: 'SUPERVISOR', l: 'Supervisor' }, { v: 'MANAGER', l: 'Manager' }, { v: 'OWNER', l: 'Owner' }] },
      { key: 'Authority_Limit', group: G6, label: 'Authority Limit', type: 'number', w: 130, hint: 'Batas kewenangan, angka bebas sesuai konteks task.' },
      { key: 'Spending_Limit', group: G6, label: 'Spending Limit (Rp)', type: 'number', w: 150 },
      { key: 'Escalation_Enabled', group: G7, label: 'Aktif', type: 'check', w: 70 },
      { key: 'Escalation_Trigger', group: G7, label: 'Trigger', type: 'text', w: 220, placeholder: 'Mis: Belum selesai melewati jam Due' },
      { key: 'Escalation_To', group: G7, label: 'Eskalasi Kepada', type: 'select', w: 150, default: 'MANAGER', options: ['SUPERVISOR', 'MANAGER', 'OWNER', 'ADMIN'] },
      { key: 'Escalation_Time_Limit', group: G7, label: 'Batas Waktu (jam)', type: 'number', w: 140 },
      { key: 'SOP_Reference', group: G8, label: 'Referensi SOP', type: 'text', w: 190, hint: 'Link atau kode dokumen.' },
      { key: 'Work_Instruction', group: G8, label: 'Petunjuk Kerja', type: 'textarea', w: 230 },
      { key: 'Tools_Equipment', group: G8, label: 'Tools / Equipment', type: 'text', w: 190 },
      { key: 'Required_Resources', group: G8, label: 'Sumber Daya', type: 'text', w: 190 },
      { key: 'Safety_Instruction', group: G8, label: 'Petunjuk Keselamatan', type: 'textarea', w: 230 }
    ],
    rows: initial,
    save: function(v){
      var type = v.Schedule_Type, t = function(x){ return String(x === undefined || x === null ? '' : x).trim(); };
      var data = {
        Task_Name: t(v.Task_Name), Task_Item: String(v.Task_Item || ''), Department: t(v.Department), Position: t(v.Position),
        Schedule_Type: type, Task_Type: v.Task_Type, Frequency: v.Frequency, Task_Category: v.Task_Category,
        Day_Of_Week: type === 'WEEKLY' ? v.DayVal : '', Day_Of_Month: type === 'MONTHLY' ? v.DayVal : '',
        Primary_PIC_ID: v.Primary_PIC_ID, Backup_PIC_ID: v.Backup_PIC_ID, Start_Time: v.Start_Time, Due_Time: v.Due_Time,
        Required: !!v.Required, Photo_Required: !!v.Photo_Required, Sort_Order: v.Sort_Order === '' ? 0 : v.Sort_Order,
        Description: String(v.Description || ''), Output: String(v.Output || ''),
        Authority_Level: v.Authority_Level, Authority_Limit: v.Authority_Limit, Spending_Limit: v.Spending_Limit,
        Escalation_Enabled: !!v.Escalation_Enabled, Escalation_Trigger: t(v.Escalation_Trigger), Escalation_To: v.Escalation_To,
        Escalation_Time_Limit: v.Escalation_Time_Limit, SOP_Reference: t(v.SOP_Reference), Work_Instruction: t(v.Work_Instruction),
        Tools_Equipment: t(v.Tools_Equipment), Required_Resources: t(v.Required_Resources), Safety_Instruction: t(v.Safety_Instruction)
      };
      var p = existing ? call('updateTaskMaster', STATE.token, existing.Task_ID, data) : call('addTaskMaster', STATE.token, data);
      return p.then(function(saved){
        var id = existing ? existing.Task_ID : saved.Task_ID;
        var hasRaci = v.Accountable || (v.Consulted && v.Consulted.length) || (v.Informed && v.Informed.length);
        if(!existing && !hasRaci) return null; // task baru tanpa RACI: tidak perlu panggilan tambahan
        return Promise.all([
          call('setTaskAccountable', STATE.token, id, v.Accountable || ''),
          call('setRaciConsultedInformed', STATE.token, id, v.Consulted || [], v.Informed || [])
        ]);
      });
    },
    onDone: loadTaskMasterTable
  });
}

var TM_SELECTED = {};
function loadTaskMasterTable(){
  TM_SELECTED = {};
  call('getTaskMaster', STATE.token).then(function(records){
    CACHE.taskMaster = records;
    var empMap = {}; CACHE.employees.forEach(function(e){ empMap[e.Employee_ID] = e.Name; });
    var rows = records.map(function(t){
      return '<tr><td><input type="checkbox" class="tmRowChk" value="'+t.Task_ID+'" onchange="onTMRowCheck(\''+t.Task_ID+'\',this.checked)"></td>' +
        '<td>'+esc(t.Task_Name)+'</td><td>'+badge(t.Schedule_Type)+'</td>' +
        '<td>'+badge(t.Task_Type)+'</td><td>'+badge(t.Frequency)+'</td><td>'+badge(t.Task_Category)+'</td>' +
        '<td>'+esc(empMap[t.Primary_PIC_ID]||t.Primary_PIC_ID||'-')+'</td><td>'+esc(empMap[t.Backup_PIC_ID]||t.Backup_PIC_ID||'-')+'</td>' +
        '<td>'+badge(t.Status)+'</td><td><button class="btn sm secondary" onclick="openTaskMasterForm(\''+t.Task_ID+'\')">Edit</button> ' +
        (t.Status==='ACTIVE' ? '<button class="btn sm warn" onclick="deactivateTM(\''+t.Task_ID+'\')">Nonaktifkan</button> ' : '') +
        '<button class="btn sm danger" onclick="deleteTM(\''+t.Task_ID+'\')">Hapus</button></td></tr>';
    }).join('');
    document.getElementById('tmTableWrap').innerHTML = '<table class="tbl"><thead><tr>' +
      '<th><input type="checkbox" id="tmSelectAllChk" onchange="onTMSelectAll(this.checked)"></th>' +
      '<th>Nama Task</th><th>Jadwal</th><th>Sifat Tugas</th><th>Frekuensi</th><th>Tahap Kerja</th><th>Primary PIC</th><th>Backup PIC</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="10" class="empty-state">Belum ada task master.</td></tr>') + '</tbody></table>';
    updateTMDeleteAllBtn();
  });
}
function onTMSelectAll(checked){
  document.querySelectorAll('.tmRowChk').forEach(function(chk){
    chk.checked = checked;
    TM_SELECTED[chk.value] = checked;
  });
  updateTMDeleteAllBtn();
}
function onTMRowCheck(taskId, checked){
  TM_SELECTED[taskId] = checked;
  var all = document.querySelectorAll('.tmRowChk');
  var allChecked = all.length > 0 && Array.prototype.every.call(all, function(c){ return c.checked; });
  var selectAllChk = document.getElementById('tmSelectAllChk');
  if(selectAllChk) selectAllChk.checked = allChecked;
  updateTMDeleteAllBtn();
}
function updateTMDeleteAllBtn(){
  var ids = Object.keys(TM_SELECTED).filter(function(k){ return TM_SELECTED[k]; });
  var btn = document.getElementById('tmDeleteAllBtn');
  if(!btn) return;
  btn.style.display = ids.length ? 'inline-block' : 'none';
  btn.textContent = '\uD83D\uDDD1 Hapus Terpilih (' + ids.length + ')';
}
function deleteTM(taskId){
  confirmAction('Hapus task master ini secara permanen? Tindakan ini tidak bisa dibatalkan.', function(){
    call('deleteTaskMaster', STATE.token, taskId).then(function(){ toast('SUCCESS','Task master dihapus.'); loadTaskMasterTable(); });
  });
}
function deleteSelectedTM(){
  var ids = Object.keys(TM_SELECTED).filter(function(k){ return TM_SELECTED[k]; });
  if(!ids.length){ toast('WARNING','Belum ada task yang dipilih.'); return; }
  confirmAction('Hapus '+ids.length+' task master terpilih secara permanen? Tindakan ini tidak bisa dibatalkan.', function(){
    call('bulkDeleteTaskMaster', STATE.token, ids).then(function(r){
      toast('SUCCESS', r.deleted + ' task master dihapus.');
      loadTaskMasterTable();
    });
  });
}
function empOptions(selectedId){
  return '<option value="">-</option>' + activeEmps_().map(function(e){ return '<option value="'+e.Employee_ID+'"'+(String(e.Employee_ID)===String(selectedId)?' selected':'')+'>'+esc(e.Name)+'</option>'; }).join('');
}
function empOptionsMulti(){
  return activeEmps_().map(function(e){ return '<option value="'+e.Employee_ID+'">'+esc(e.Name)+'</option>'; }).join('');
}
function deactivateTM(taskId){
  confirmAction('Nonaktifkan task master ini?', function(){
    call('deactivateTaskMaster', STATE.token, taskId).then(function(){ toast('SUCCESS','Task master dinonaktifkan.'); loadTaskMasterTable(); });
  });

/**
 * Add/Edit a task directly from the Daily/Weekly/Monthly Task view. Writes
 * through to the same Task Master record used by the "Task Master" screen
 * (upsertTaskFromPeriod on the backend keeps them in sync both ways), so a
 * task added or edited here also shows up correctly there, and vice versa.
 */
function openPeriodTaskForm(period, taskId){
  ensureEmployeesCache().then(ensureTaskMasterCache).then(function(){
    var existing = taskId ? (CACHE.taskMaster||[]).filter(function(t){ return String(t.Task_ID)===String(taskId); })[0] : null;
    var freqLabel = { daily:'Harian', weekly:'Mingguan', monthly:'Bulanan' }[period];
    var body = '<div class="formrow"><label>Nama Task</label><input class="input" id="ptName" value="'+(existing?esc(existing.Task_Name):'')+'"></div>' +
      '<div class="formrow"><label>Task Item <span class="muted" style="font-weight:400;">(checklist, satu item per baris)</span></label><textarea class="input" id="ptItem" rows="4">'+(existing?esc(existing.Task_Item):'')+'</textarea></div>' +
      '<div class="formrow"><label>Primary PIC</label><select class="input" id="ptPrimary" onchange="onPTPicChange()">'+empOptions(existing?existing.Primary_PIC_ID:null)+'</select></div>' +
      '<div class="formrow"><label>Backup PIC</label><select class="input" id="ptBackup">'+empOptions(existing?existing.Backup_PIC_ID:null)+'</select></div>' +
      '<div class="formrow"><label>Departemen <span class="muted" style="font-weight:400;">(otomatis dari Primary PIC)</span></label><input class="input" id="ptDept" value="'+(existing?esc(existing.Department):'')+'" readonly></div>' +
      '<div class="formrow"><label>Posisi <span class="muted" style="font-weight:400;">(otomatis dari Primary PIC)</span></label><input class="input" id="ptPos" value="'+(existing?esc(existing.Position):'')+'" readonly></div>' +
      '<div class="formrow"><label>Jadwal</label><input class="input" value="'+freqLabel+'" readonly></div>' +
      '<div id="ptFreqWrap"></div>' +
      '<div class="formrow"><label>Task Type (Sifat Tugas)</label><select class="input" id="ptTaskType">' +
        '<option value="RECURRING">Recurring</option><option value="ONE_TIME">One-Time</option>' +
        '<option value="AD_HOC">Ad Hoc</option><option value="IMPROVEMENT">Improvement</option>' +
      '</select></div>' +
      '<div class="formrow"><label>Work Stage (Tahap Kerja)</label><select class="input" id="ptCat">' +
        '<option value="">-</option><option value="PREPARATION">Preparation</option><option value="OPERATION">Operation</option>' +
        '<option value="CLOSING">Closing</option><option value="IMPROVEMENT">Improvement</option><option value="OTHER">Other</option>' +
      '</select></div>' +
      '<div class="formrow"><label>Jam Mulai</label><input type="time" lang="id-ID" step="60" class="input" id="ptStart" value="'+(existing?esc(existing.Start_Time):'')+'"></div>' +
      '<div class="formrow"><label>Jam Due</label><input type="time" lang="id-ID" step="60" class="input" id="ptDue" value="'+(existing?esc(existing.Due_Time):'')+'"></div>' +
      '<div class="formrow"><label><input type="checkbox" id="ptRequired" '+(!existing || existing.Required===true || existing.Required==='TRUE' || existing.Required==='true' ? 'checked' : '')+'> Wajib Dikerjakan</label></div>' +
      '<div class="formrow"><label><input type="checkbox" id="ptPhotoReq" '+(existing && (existing.Photo_Required===true || existing.Photo_Required==='TRUE' || existing.Photo_Required==='true') ? 'checked' : '')+'> Wajib Foto Bukti</label></div>' +
      '<div class="formrow"><label>Urutan Tampil</label><input type="number" class="input" id="ptSort" value="'+(existing?existing.Sort_Order:0)+'"></div>' +
      '<div class="formrow"><label>Deskripsi</label><textarea class="input" id="ptDesc">'+(existing?esc(existing.Description):'')+'</textarea></div>' +
      '<div class="formrow"><label>Output <span class="muted" style="font-weight:400;">(hasil yang diharapkan dari tugas ini)</span></label><textarea class="input" id="ptOutput">'+(existing?esc(existing.Output):'')+'</textarea></div>';
    openModal(existing ? 'Edit Task' : 'Tambah Task', body,
      '<button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn" onclick="submitPeriodTaskForm(\''+period+'\',\''+(taskId||'')+'\')">Simpan</button>');
    setTimeout(function(){
      document.getElementById('ptTaskType').value = existing ? (existing.Task_Type||'RECURRING') : 'RECURRING';
      document.getElementById('ptCat').value = existing ? (existing.Task_Category||'') : '';
      renderPeriodTaskFreqFields(period, existing);
      if(!existing) onPTPicChange();
    }, 0);
  });
}
function onPTPicChange(){
  var picId = document.getElementById('ptPrimary').value;
  var emp = CACHE.employees.filter(function(e){ return String(e.Employee_ID)===String(picId); })[0];
  document.getElementById('ptDept').value = emp ? (emp.Department||'') : '';
  document.getElementById('ptPos').value = emp ? (emp.Position||'') : '';
}
function renderPeriodTaskFreqFields(period, existing){
  var wrap = document.getElementById('ptFreqWrap');
  if(period === 'weekly'){
    var days = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    wrap.innerHTML = '<div class="formrow"><label>Hari (Weekly)</label><select class="input" id="ptDow">' +
      days.map(function(d,i){ return '<option value="'+(i+1)+'"'+(existing && Number(existing.Day_Of_Week)===(i+1)?' selected':'')+'>'+d+'</option>'; }).join('') + '</select></div>';
  } else if(period === 'monthly'){
    wrap.innerHTML = '<div class="formrow"><label>Tanggal (Monthly, 1-31)</label><input type="number" min="1" max="31" class="input" id="ptDom" value="'+(existing&&existing.Day_Of_Month?existing.Day_Of_Month:1)+'"></div>';
  } else {
    wrap.innerHTML = '';
  }
}
function submitPeriodTaskForm(period, taskId){
  var freqByPeriod = { daily:'DAILY', weekly:'WEEKLY', monthly:'MONTHLY' };
  var data = { Task_Name: document.getElementById('ptName').value, Department: document.getElementById('ptDept').value,
    Position: document.getElementById('ptPos').value,
    Task_Type: document.getElementById('ptTaskType').value,
    Frequency: freqByPeriod[period], Task_Category: document.getElementById('ptCat').value,
    Day_Of_Week: period==='weekly' ? document.getElementById('ptDow').value : '',
    Day_Of_Month: period==='monthly' ? document.getElementById('ptDom').value : '',
    Primary_PIC_ID: document.getElementById('ptPrimary').value, Backup_PIC_ID: document.getElementById('ptBackup').value,
    Start_Time: document.getElementById('ptStart').value, Due_Time: document.getElementById('ptDue').value,
    Required: document.getElementById('ptRequired').checked, Photo_Required: document.getElementById('ptPhotoReq').checked,
    Sort_Order: document.getElementById('ptSort').value,
    Task_Item: document.getElementById('ptItem').value,
    Description: document.getElementById('ptDesc').value,
    Output: document.getElementById('ptOutput').value };
  if(!data.Task_Name){ toast('WARNING','Nama Task wajib diisi.'); return; }
  call('upsertTaskFromPeriod', STATE.token, period, taskId, data).then(function(){
    toast('SUCCESS','Task tersimpan.');
    closeModal();
    CACHE.taskMaster = null;
    loadTaskTable(period, window.__lastTaskCat||'');
  });
}
function deletePeriodTask(period, taskId){
  confirmAction('Hapus task ini secara permanen (dari Task Master dan dari daftar '+period+')? Tindakan ini tidak bisa dibatalkan.', function(){
    call('deleteTaskFromPeriod', STATE.token, period, taskId).then(function(){
      toast('SUCCESS','Task dihapus.');
      CACHE.taskMaster = null;
      loadTaskTable(period, window.__lastTaskCat||'');
    });
  });
}

/**
 * Reads a user-selected logo file (JPG/PNG) and downsizes it client-side via
 * canvas before turning it into a base64 data URL - the app no longer takes
 * a logo URL, it stores the actual image so it works even if the original
 * file is later moved/deleted. Downsizing keeps the resulting string well
 * under Google Sheets' per-cell character limit.
 */
function handleLogoFileSelect(input){
  var file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\/(png|jpe?g)$/i.test(file.type)){
    toast('ERROR','Format logo harus JPG atau PNG.');
    input.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 200;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var cw = Math.max(1, Math.round(img.width * scale));
      var ch = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var isJpeg = /jpe?g/i.test(file.type);
      var dataUrl = isJpeg ? canvas.toDataURL('image/jpeg', 0.85) : canvas.toDataURL('image/png');
      if(dataUrl.length > 45000){
        toast('WARNING','Gambar logo masih terlalu besar setelah diperkecil. Coba gunakan gambar yang lebih sederhana.');
        return;
      }
      document.getElementById('brandLogoUrlInput').value = dataUrl;
      renderBrandingPreview();
    };
    img.onerror = function(){ toast('ERROR','Gagal membaca file gambar.'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast('ERROR','Gagal membaca file.'); };
  reader.readAsDataURL(file);
}

/** Superset of every menu item across all roles (for icon + access configuration), de-duplicated by ID, in a sensible display order. */
function allMenuItemsSuperset_(){
  var order = [], seen = {};
  ['OWNER','MANAGER','ADMIN','TECHNICIAN','EMPLOYEE'].forEach(function(role){
    (MENU[role]||[]).forEach(function(item){
      if(item.group || seen[item.id]) return;
      seen[item.id] = true; order.push(item);
    });
  });
  return order;
}
function renderMenuIconTable(){
  var items = allMenuItemsSuperset_();
  var icons = (APP_META.menuIcons || {});
  var rows = items.map(function(item){
    var custom = icons[item.id] || '';
    var current = custom || item.ico;
    // Only prefill the editable value with a saved CUSTOM icon (plain
    // emoji/char). Defaults are HTML entities (e.g. &#9632;) meant to be
    // decoded, not escaped, so they're only ever shown via the "Saat Ini"
    // preview span (unescaped) and the input's placeholder - never escaped
    // into the value attribute, or they'd render as literal entity text.
    return '<tr class="menu-icon-row"><td>'+esc(item.label)+'</td><td><span class="ico">'+current+'</span></td>' +
      '<td><input class="input menu-icon-input" id="micon_'+item.id+'" value="'+esc(custom)+'" placeholder="'+item.ico+'"></td></tr>';
  }).join('');
  document.getElementById('menuIconTableWrap').innerHTML = '<table class="tbl"><thead><tr><th>Menu</th><th>Saat Ini</th><th>Ikon Baru</th></tr></thead><tbody>'+rows+'</tbody></table>';

var PERF_MGMT_ROLES_ = ['OWNER','MANAGER','SUPERVISOR','ADMIN'];
function perfIsMgmt_(){ return PERF_MGMT_ROLES_.indexOf(STATE.role) !== -1; }
function perfPad2_(n){ return ('0'+n).slice(-2); }
function perfScoreColor_(score, threshold){
  threshold = threshold || 80;
  return score >= 100 ? '#0f9d58' : (score >= threshold ? '#f2994a' : '#e0433a');
}
function perfDeptList_(){
  var seen = {}, out = [];
  activeEmps_().forEach(function(e){
    var d = String(e.Department||'').trim();
    if(d && !seen[d.toLowerCase()]){ seen[d.toLowerCase()] = true; out.push(d); }
  });
  return out.sort();
}
var PERF_METRIC_LABELS = {};
function ensurePerfMetricLabels_(){
  if(Object.keys(PERF_METRIC_LABELS).length) return Promise.resolve();
  return call('getKpiMetricList', STATE.token).then(function(list){
    list.forEach(function(m){ PERF_METRIC_LABELS[m.key] = m; });
  });
}
var LEVEL_LABELS_ = { COMPANY:'Perusahaan', DEPARTMENT:'Departemen', INDIVIDUAL:'Individu' };
function objLevelTag_(o){
  var level = o.Level || 'INDIVIDUAL';
  var extra = level==='DEPARTMENT' ? ': '+esc(o.Department||'') : '';
  return ' <span class="muted" style="font-size:11px;">['+esc(LEVEL_LABELS_[level]||level)+extra+' | '+esc(o.Period)+']</span>';
}

var PERF_STATE = { type:'MONTH', year:new Date().getFullYear(), sub:new Date().getMonth()+1, entityType:'EMP' };

function perfBuildPeriod_(){
  if(PERF_STATE.type==='YEAR') return String(PERF_STATE.year);
  if(PERF_STATE.type==='QUARTER') return PERF_STATE.year+'-Q'+PERF_STATE.sub;
  return PERF_STATE.year+'-'+perfPad2_(PERF_STATE.sub);
}
function perfFillSub_(){
  var sel = document.getElementById('perfSub');
  if(!sel) return;
  var type = document.getElementById('perfType').value;
  PERF_STATE.type = type;
  if(type==='YEAR'){ sel.style.display = 'none'; return; }
  sel.style.display = '';
  var opts = '';
  if(type==='MONTH'){
    if(PERF_STATE.sub>12) PERF_STATE.sub = 1;
    for(var m=1;m<=12;m++) opts += '<option value="'+m+'" '+(m===PERF_STATE.sub?'selected':'')+'>'+ID_MONTH_NAMES[m-1]+'</option>';
  } else {
    if(PERF_STATE.sub>4) PERF_STATE.sub = Math.floor((PERF_STATE.sub-1)/3)+1;
    for(var q=1;q<=4;q++) opts += '<option value="'+q+'" '+(q===PERF_STATE.sub?'selected':'')+'>Kuartal '+q+'</option>';
  }
  sel.innerHTML = opts;
}
function perfReadControls_(){
  PERF_STATE.type = document.getElementById('perfType').value;
  PERF_STATE.year = parseInt(document.getElementById('perfYear').value, 10) || new Date().getFullYear();
  if(PERF_STATE.type!=='YEAR') PERF_STATE.sub = parseInt(document.getElementById('perfSub').value, 10) || 1;
}

    for(var i=0;i<list.length;i++){
      if(list[i].id==='leaderboard'){ Array.prototype.splice.apply(list, [i+1, 0].concat(items)); return; }

  inject(MENU.MANAGER, mgmtItems); // MENU.SUPERVISOR memakai array yang sama

})();

/*************************************************************************************************
 * MODULE: REKAP KETEPATAN WAKTU - siapa telat (berapa lama), siapa datang
 * awal, siapa overtime, siapa pulang sebelum genap 8 jam kerja. Dihitung
 * dari Late_Minutes/Early_Minutes/Overtime_Minutes/Shortfall_Minutes yang
 * sekarang shift-aware (mengikuti Jadwal Shift per karyawan, bukan lagi
 * satu jam kerja global untuk semua orang).
 *************************************************************************************************/
var ATTRECAP_STATE = { periodStart: null, periodEnd: null };
function fmtMinutesToHM(mins){
  mins = Number(mins) || 0;
  if(mins <= 0) return '0 menit';
  var h = Math.floor(mins/60), m = mins%60;
  return (h>0 ? h+' jam ' : '') + (m>0 || h===0 ? m+' menit' : '');
}
RENDERERS.attrecap = function(){
  var html = '<div class="card" style="margin-bottom:14px;"><div class="toolbar" style="align-items:center;flex-wrap:wrap;margin:0;">' +
    '<label style="font-size:12px;color:#666;">Periode</label>' +
    '<input type="date" class="input" id="attRecapStart" style="width:150px;">' +
    '<span class="muted">s/d</span>' +
    '<input type="date" class="input" id="attRecapEnd" style="width:150px;">' +
    '<button class="btn secondary" onclick="applyAttRecapPeriod()">&#128269; Tampilkan</button>' +
    '</div><p class="muted" style="font-size:12px;margin:8px 0 0;">Menampilkan siapa yang telat (dan berapa lama), datang awal, overtime, dan kurang dari 8 jam kerja - berdasarkan Jadwal Shift masing-masing karyawan.</p></div>' +
    '<div id="attRecapWrap"></div>';
  document.getElementById('content').innerHTML = html;
  call('getBookPeriod', STATE.token).then(function(p){
    ATTRECAP_STATE.periodStart = ATTRECAP_STATE.periodStart || p.start;
    ATTRECAP_STATE.periodEnd = ATTRECAP_STATE.periodEnd || p.end;
    document.getElementById('attRecapStart').value = ATTRECAP_STATE.periodStart;
    document.getElementById('attRecapEnd').value = ATTRECAP_STATE.periodEnd;
    loadAttRecap();
  });
};
function applyAttRecapPeriod(){
  ATTRECAP_STATE.periodStart = document.getElementById('attRecapStart').value;
  ATTRECAP_STATE.periodEnd = document.getElementById('attRecapEnd').value;
  if(!ATTRECAP_STATE.periodStart || !ATTRECAP_STATE.periodEnd || ATTRECAP_STATE.periodStart > ATTRECAP_STATE.periodEnd){
    toast('WARNING','Periode tidak valid.'); return;
  }
  loadAttRecap();
}
function loadAttRecap(){
  document.getElementById('attRecapWrap').innerHTML = '<div class="empty-state">Memuat rekap...</div>';
  call('getAttendanceTimeRecap', STATE.token, ATTRECAP_STATE.periodStart, ATTRECAP_STATE.periodEnd).then(function(res){
    var wrap = document.getElementById('attRecapWrap');
    if(!res.rows.length){ wrap.innerHTML = '<div class="empty-state">Tidak ada karyawan aktif.</div>'; return; }
    wrap.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>Nama</th><th>Hadir</th><th>Tepat Waktu</th>' +
      '<th style="color:#e0433a;">Telat</th><th style="color:#e0433a;">Total Telat</th>' +
      '<th style="color:#0f9d58;">Datang Awal</th><th style="color:#0f9d58;">Total Lebih Awal</th>' +
      '<th style="color:#2f80ed;">Overtime</th><th style="color:#2f80ed;">Total Overtime</th>' +
      '<th style="color:#f2994a;">Kurang Jam Kerja</th><th style="color:#f2994a;">Total Kekurangan</th>' +
      '</tr></thead><tbody>' +
      res.rows.map(function(r){
        return '<tr><td>'+esc(r.Name)+'<div class="muted" style="font-size:11px;">'+esc(r.Position||'')+'</div></td>' +
          '<td>'+r.HadirCount+'</td><td>'+r.OnTimeCount+'</td>' +
          '<td>'+(r.LateCount||'-')+'</td><td>'+(r.LateCount?fmtMinutesToHM(r.LateMinutesTotal):'-')+'</td>' +
          '<td>'+(r.EarlyCount||'-')+'</td><td>'+(r.EarlyCount?fmtMinutesToHM(r.EarlyMinutesTotal):'-')+'</td>' +
          '<td>'+(r.OvertimeCount||'-')+'</td><td>'+(r.OvertimeCount?fmtMinutesToHM(r.OvertimeMinutesTotal):'-')+'</td>' +
          '<td>'+(r.ShortfallCount||'-')+'</td><td>'+(r.ShortfallCount?fmtMinutesToHM(r.ShortfallMinutesTotal):'-')+'</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="muted" style="font-size:12px;margin-top:10px;">Diurutkan dari yang paling banyak total keterlambatannya. "Kurang Jam Kerja" dihitung dari total jam kerja aktual (Check-out - Check-in) di bawah 8 jam.</p>';
  });
}

/*************************************************************************************************
 * PWA: install prompt, iOS "Add to Home Screen" hint, minimal SW registration
 * Additive only - never touches STATE, auth, or any existing function above.
 *************************************************************************************************/
var PWA_DISMISS_KEY = 'wlp_oms_pwa_banner_dismissed';
var pwaDeferredPrompt = null;

function pwaIsStandalone_(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function pwaIsIOS_(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent || '');
}
function pwaBannerDismissed_(){
  try{ return sessionStorage.getItem(PWA_DISMISS_KEY) === '1'; }catch(e){ return false; }
}
function pwaDismissBanner(){
  document.getElementById('pwaInstallBanner').style.display = 'none';
  try{ sessionStorage.setItem(PWA_DISMISS_KEY, '1'); }catch(e){}
}
function pwaShowBanner_(text, showInstallBtn){
  if(pwaIsStandalone_() || pwaBannerDismissed_()) return;
  document.getElementById('pwaInstallText').textContent = text;
  document.getElementById('pwaInstallBtn').style.display = showInstallBtn ? 'inline-block' : 'none';
  document.getElementById('pwaInstallBanner').style.display = 'flex';
}
function pwaTriggerInstall(){
  if(!pwaDeferredPrompt) return;
  pwaDeferredPrompt.prompt();
  pwaDeferredPrompt.userChoice.then(function(){ pwaDeferredPrompt = null; pwaDismissBanner(); });
}
window.addEventListener('beforeinstallprompt', function(e){
  // Chrome/Android/Edge: browser decided the app is installable.
  e.preventDefault();
  pwaDeferredPrompt = e;
  pwaShowBanner_('Install Wonderland Management di HP/laptop Anda untuk akses lebih cepat.', true);
});
window.addEventListener('appinstalled', function(){ pwaDismissBanner(); pwaDeferredPrompt = null; });

function pwaInit_(){
  if(pwaIsStandalone_()) return; // already installed & running as an app - nothing to show
  if(pwaIsIOS_()){
    // iOS Safari has no install prompt API - show the manual instructions instead.
    pwaShowBanner_('Untuk install: buka menu Share (kotak dengan panah ke atas) lalu pilih "Add to Home Screen".', false);
  }
  // Best-effort service worker registration. This is a progressive
  // enhancement only (helps installability signals in Chrome); if it fails
  // for any reason (unsupported browser, blocked by the hosting sandbox,
  // etc.) the app must keep working exactly as before, so every failure is
  // swallowed silently.
  if('serviceWorker' in navigator){
    try{
      var swUrl = location.href.split('?')[0].split('#')[0] + '?pwa=sw';
      navigator.serviceWorker.register(swUrl).catch(function(){ /* ignore - non-critical */ });
    }catch(e){ /* ignore - non-critical */ }
  }
}

window.onload = function(){
  document.getElementById('loginPassword').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  loadAppMeta();
  attemptResumeSession_();
  pwaInit_();
};
